<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- An abandoned two-storey police station in the ruins: boarded windows, a crooked sign,
       a bent radio mast, sandbags at the door, a burnt-out patrol car and a road barrier. -->
  <defs>
    <clipPath id="disc"><circle cx="256" cy="256" r="232"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdb98c"/>
      <stop offset="0.45" stop-color="#e6d7b0"/>
      <stop offset="0.7" stop-color="#f3e9cc"/>
    </linearGradient>
    <linearGradient id="asphalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9d968a"/>
      <stop offset="1" stop-color="#857e72"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cbc2ad"/>
      <stop offset="1" stop-color="#b3a992"/>
    </linearGradient>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0v7" stroke="#33281c" stroke-width="1.6" opacity="0.55"/>
    </pattern>
    <pattern id="hatch-sky" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)">
      <path d="M0 0v8" stroke="#6a5842" stroke-width="1.4" opacity="0.45"/>
    </pattern>
    <!-- Window kinds, 28 by 40, drawn from their top-left corner. -->
    <g id="window-broken" stroke="#33281c" stroke-linejoin="round">
      <path d="M0 0h28v40H0z" fill="#2a2016" stroke-width="3"/>
      <path d="M0 0h28v12L20 6l-6 10-6-8-8 6z" fill="#8fa0a0" stroke-width="1.6"/>
      <path d="M14 0v40M0 20h28" stroke="#6a5842" stroke-width="2"/>
      <path d="M-4 40h36v5H-4z" fill="#a39d90" stroke-width="2.5"/>
    </g>
    <g id="window-boarded" stroke="#33281c" stroke-linejoin="round">
      <path d="M0 0h28v40H0z" fill="#2a2016" stroke-width="3"/>
      <path d="M-3 6 31 2v8L-3 14zM-3 19l34 3v8l-34-3zM-3 34l34-4v8l-34 4z" fill="#a07a4c" stroke-width="2"/>
      <path d="M2 8h.01M26 5h.01M2 23h.01M26 25h.01M2 37h.01M26 34h.01" stroke-width="3" stroke-linecap="round"/>
      <path d="M-4 40h36v5H-4z" fill="#a39d90" stroke-width="2.5"/>
    </g>
    <g id="window-barred" stroke="#33281c" stroke-linejoin="round">
      <path d="M0 0h28v40H0z" fill="#2a2016" stroke-width="3"/>
      <path d="M0 0h28v10L16 4 0 12z" fill="#8fa0a0" stroke-width="1.6"/>
      <path d="M5 0v40M11 0v40M17 0v40M23 0v40" stroke="#6a5842" stroke-width="2.4"/>
      <path d="M-4 40h36v5H-4z" fill="#a39d90" stroke-width="2.5"/>
    </g>
  </defs>

  <g clip-path="url(#disc)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <g stroke="#6a5842" stroke-width="2.5" stroke-linejoin="round">
      <path d="M24 108c10-22 36-28 52-14 10-24 46-28 60-6 18-12 44-4 48 16 14 0 24 10 22 22H24z" fill="#eadcb6"/>
      <path d="M24 116h182v12H24z" fill="url(#hatch-sky)" stroke="none"/>
    </g>
    <!-- Smoke rising from somewhere behind the town. -->
    <path d="M448 300c-14-22 10-34-2-56s14-36 2-60 12-40 6-64" fill="none" stroke="#a39d90" stroke-width="16" stroke-linecap="round" opacity="0.5"/>
    <path d="M430 110q6-6 12 0q6-6 12 0M70 196q5-5 10 0q5-5 10 0" fill="none" stroke="#33281c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Ruined blocks in the distance. -->
    <g fill="#b9b2a2" stroke="#6a5842" stroke-width="2.5" stroke-linejoin="round">
      <path d="M0 330V214h40l8 10 6-8h34V330z"/>
      <path d="M396 330V196h50l6 14 8-6 6 10h40V330z"/>
    </g>
    <g fill="#8a8377">
      <path d="M10 228h10v12H10zM30 228h10v12H30zM10 252h10v12H10zM50 252h10v12H50zM70 228h10v12H70zM30 276h10v12H30zM70 276h10v12H70zM10 300h10v12H10zM50 300h10v12H50z"/>
      <path d="M408 212h10v12h-10zM428 212h10v12h-10zM468 228h10v12h-10zM408 236h10v12h-10zM448 236h10v12h-10zM428 260h10v12h-10zM468 260h10v12h-10zM408 284h10v12h-10zM448 284h10v12h-10z"/>
    </g>

    <!-- Cracked asphalt yard. -->
    <path d="M0 330H512V512H0z" fill="url(#asphalt)"/>
    <path d="M0 330H512" stroke="#33281c" stroke-width="2.5"/>
    <path d="M0 336H512" stroke="#6a5842" stroke-width="1.5" opacity="0.6"/>
    <g fill="none" stroke="#5f594f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M60 420l30 10 14 22 26 6M104 452l-6 30M300 430l28-8 18 14 30-4M346 436l4 28 22 10M200 480l24-10 30 6M430 470l20 10"/>
    </g>
    <path d="M150 470h60M280 486h40M40 460h30" stroke="#ece0c0" stroke-width="5" stroke-linecap="round" stroke-dasharray="20 14" opacity="0.5"/>

    <!-- The station and everything at its walls, scaled up from its base to fill the frame. -->
    <g transform="translate(226 336) scale(1.18) translate(-226 -336)">
    <!-- Shadow of the station. -->
    <path d="M112 336H396l40 16H140z" fill="#33281c" opacity="0.22"/>

    <!-- The radio mast on the roof, bent at the top. -->
    <g stroke="#33281c" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M352 170 362 60M376 172 366 60" stroke-width="3.5"/>
      <path d="M354 150l20-10M356 130l18-14M358 110l15-12M360 90l12-10M356 150l18 6M357 128l17 6M359 108l15 4M361 88l12 4" stroke-width="2"/>
      <path d="M362 60l2-12 18-20M366 60l-2-10" stroke-width="3"/>
      <path d="M382 28l10-4M362 60 300 168M366 60l64 108" stroke-width="1.2"/>
      <circle cx="364" cy="56" r="3" fill="#b4432b" stroke-width="1.6"/>
    </g>

    <!-- The station building, seen three-quarter. -->
    <g stroke="#33281c" stroke-linejoin="round" stroke-linecap="round">
      <!-- Side wall, in shade. -->
      <path d="M340 168 396 182V326L340 336z" fill="#9c937f" stroke-width="3.5"/>
      <path d="M340 168 396 182V326L340 336z" fill="url(#hatch)" stroke="none"/>
      <path d="M352 196l24 5v34l-24-4zM352 268l24 3v34l-24 2z" fill="#2a2016" stroke-width="2.5"/>
      <path d="M340 248 396 254" stroke-width="2.5"/>
      <!-- Front wall of concrete panels. -->
      <path d="M112 168H340V336H112z" fill="url(#facade)" stroke-width="3.5"/>
      <path d="M112 252H340" stroke-width="3"/>
      <path d="M112 246H340" stroke-width="1.6" opacity="0.6"/>
      <path d="M169 168V246M226 168V246M283 168V246M169 252v84M283 252v84" stroke-width="1.4" opacity="0.5"/>
      <path d="M112 312H340" stroke-width="1.4" opacity="0.5"/>
      <!-- Parapet, with a corner knocked off showing bent rebar. -->
      <path d="M106 158h146l8 6 10-6h80v12H106z" fill="#a39d90" stroke-width="3"/>
      <path d="M104 156h28l4 8 8-4 8 10H104z" fill="#d9c9a0" stroke="none"/>
      <path d="M112 170V164l20-6 4 8 8-4 8 8" fill="none" stroke-width="2.5"/>
      <path d="M134 168l-4-12M142 166l2-12" stroke="#82301c" stroke-width="1.6"/>
      <!-- A crack down the wall. -->
      <path d="M262 170l-6 18 8 12-10 20 6 14-8 12" fill="none" stroke-width="2"/>
    </g>
    <!-- Upper floor windows. -->
    <use href="#window-broken" x="126" y="186"/>
    <use href="#window-boarded" x="174" y="186"/>
    <use href="#window-broken" x="222" y="186"/>
    <use href="#window-boarded" x="270" y="186"/>
    <use href="#window-barred" x="306" y="186"/>
    <!-- A survivor's red X sprayed over boards. -->
    <path d="M176 190l26 32M202 190l-24 32" stroke="#b4432b" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <!-- Ground floor windows, barred. -->
    <use href="#window-barred" x="126" y="266"/>
    <use href="#window-barred" x="170" y="266"/>
    <use href="#window-boarded" x="300" y="266"/>

    <!-- The entrance: a lost door, a crooked sign, steps and sandbags. -->
    <g stroke="#33281c" stroke-linejoin="round" stroke-linecap="round">
      <path d="M216 284h56v52h-56z" fill="#2a2016" stroke-width="3"/>
      <path d="M244 284h28v52h-28z" fill="#5d6a6a" stroke-width="2.5"/>
      <path d="M250 292h16v20h-16z" fill="#8fa0a0" stroke-width="2"/>
      <path d="M248 312h4" stroke-width="3"/>
      <path d="M210 336h68v6h-68zM204 342h80v6h-80z" fill="#a39d90" stroke-width="2.5"/>
      <g transform="rotate(-5 198 260)">
        <path d="M198 258h92v20h-92z" fill="#33281c" stroke-width="2.5"/>
        <text x="244" y="274" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="16" letter-spacing="2" fill="#ece0c0" stroke="none">POLICE</text>
      </g>
      <path d="M290 270 300 284" stroke-width="2"/>
    </g>
    <g stroke="#33281c" stroke-width="2.5" fill="#bfa877">
      <rect x="282" y="328" width="26" height="14" rx="7"/>
      <rect x="306" y="328" width="26" height="14" rx="7"/>
      <rect x="294" y="316" width="26" height="14" rx="7"/>
      <rect x="318" y="316" width="22" height="14" rx="7"/>
      <rect x="306" y="304" width="24" height="14" rx="7"/>
    </g>
    <path d="M290 336h10M314 336h10M302 324h10M314 312h8" stroke="#6a5842" stroke-width="1.6"/>

    <!-- Rubble at the knocked-off corner. -->
    <path d="M100 336l10-14 12 4 8-10 14 8 6 12z" fill="#a39d90" stroke="#33281c" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M118 326l4 6M134 322l-2 8" stroke="#33281c" stroke-width="1.6"/>

    </g>

    <!-- The burnt-out patrol car, flat tyres, a dead light bar. -->
    <g stroke="#33281c" stroke-linejoin="round" stroke-linecap="round">
      <ellipse cx="128" cy="414" rx="96" ry="10" fill="#33281c" opacity="0.25" stroke="none"/>
      <path d="M38 400v-26l14-8 30-4 18-22h62l22 22 26 4 10 10v24z" fill="#d8cfb8" stroke-width="3.5"/>
      <path d="M44 384h174" stroke="#33281c" stroke-width="8"/>
      <path d="M44 384h174" stroke="#5d6a6a" stroke-width="4"/>
      <path d="M104 344h26v18H92zM136 344h22l18 18h-40z" fill="#2a2016" stroke-width="2.5"/>
      <path d="M140 344l8 10 6-4" fill="none" stroke="#8fa0a0" stroke-width="1.6"/>
      <path d="M133 344v34" stroke-width="2"/>
      <!-- Light bar: one lamp still red. -->
      <path d="M112 334h20v8h-20z" fill="#b4432b" stroke-width="2.5"/>
      <path d="M132 334h20v8h-20z" fill="#7d7a73" stroke-width="2.5"/>
      <!-- Scorch marks. -->
      <path d="M160 366c10-2 20 2 26 10M166 372c6 0 12 2 16 8" fill="none" stroke-width="2" opacity="0.7"/>
      <path d="M170 360l40 2 6 10h-50z" fill="url(#hatch)" stroke="none"/>
      <!-- Wheels sunk flat. -->
      <path d="M62 400a18 18 0 0 1 36 0z" fill="#2a2016" stroke-width="3"/>
      <path d="M168 400a18 18 0 0 1 36 0z" fill="#2a2016" stroke-width="3"/>
      <path d="M70 400h20M176 400h20" stroke="#5d6a6a" stroke-width="3"/>
      <path d="M38 374h10M218 378h10" stroke-width="3"/>
    </g>

    <!-- A road barrier knocked askew. -->
    <g stroke="#33281c" stroke-linejoin="round" stroke-linecap="round">
      <path d="M352 384v44M462 368v48" stroke-width="5"/>
      <path d="M346 428h14M455 416h14" stroke-width="4"/>
      <g transform="rotate(-8 344 380)">
        <path d="M340 376h132v14H340z" fill="#ece0c0" stroke-width="3"/>
        <path d="M352 376h18v14h-18zM388 376h18v14h-18zM424 376h18v14h-18zM460 376h12v14h-12z" fill="#b4432b" stroke="none"/>
        <path d="M340 376h132v14H340z" fill="none" stroke-width="3"/>
      </g>
    </g>

    <!-- Scattered papers and weeds in the cracks. -->
    <g fill="#ece0c0" stroke="#33281c" stroke-width="1.8" stroke-linejoin="round">
      <path d="M250 450l16-4 4 12-16 4zM292 470l14 2-2 12-14-2zM410 448l12-6 6 10-12 6z"/>
    </g>
    <g fill="none" stroke="#5c6a2c" stroke-width="2.6" stroke-linecap="round">
      <path d="M96 456c2-12 6-20 12-26M104 458c0-12-2-20-6-26M112 456c4-8 8-14 14-16"/>
      <path d="M340 440c2-12 6-20 12-26M348 442c0-12-2-20-6-26"/>
      <path d="M380 480c4-14 8-22 16-28M390 482c0-14-2-22-8-30M400 480c4-10 10-16 16-18"/>
      <path d="M112 332c2-10 4-16 8-20M120 332c0-8-2-14-4-18M330 340c2-8 6-14 10-16"/>
    </g>
  </g>

  <!-- The medallion's frame. -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="#33281c" stroke-width="5"/>
  <circle cx="256" cy="256" r="244" fill="none" stroke="#33281c" stroke-width="9"/>
  <circle cx="256" cy="256" r="238" fill="none" stroke="#ece0c0" stroke-width="3"/>
</svg>
