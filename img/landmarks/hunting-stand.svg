<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- A raised hunting stand at the edge of a clearing: a plank cabin on four splayed poles,
       its roofing felt torn loose, a shutter hanging open, a ladder with a missing rung and
       two spent red shotgun shells in the grass below. -->
  <defs>
    <clipPath id="disc"><circle cx="256" cy="256" r="232"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdb98c"/>
      <stop offset="0.45" stop-color="#e6d7b0"/>
      <stop offset="0.7" stop-color="#f3e9cc"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f8a5a"/>
      <stop offset="1" stop-color="#6f6a40"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7efd8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f7efd8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0v7" stroke="#33281c" stroke-width="1.6" opacity="0.55"/>
    </pattern>
    <pattern id="hatch-sky" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)">
      <path d="M0 0v8" stroke="#6a5842" stroke-width="1.4" opacity="0.45"/>
    </pattern>
    <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3ad72"/>
      <stop offset="1" stop-color="#97935a"/>
    </linearGradient>
    <linearGradient id="planks" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b48b55"/>
      <stop offset="1" stop-color="#94703f"/>
    </linearGradient>
  </defs>

