<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- A lone oak in the middle of the plains: older than the towns, a gnarled trunk on buttress roots, a crown wider than it is tall, a rope swing with one rope snapped and a boundary stone in its shade. -->
  <defs>
    <clipPath id="disc"><circle cx="256" cy="256" r="232"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdb98c"/>
      <stop offset="0.45" stop-color="#e6d7b0"/>
      <stop offset="0.7" stop-color="#f3e9cc"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4bf86"/>
      <stop offset="1" stop-color="#b89c5e"/>
    </linearGradient>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0v7" stroke="#33281c" stroke-width="1.6" opacity="0.55"/>
    </pattern>
    <pattern id="hatch-sky" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)">
      <path d="M0 0v8" stroke="#6a5842" stroke-width="1.4" opacity="0.45"/>
    </pattern>
    <g id="crown">
      <circle cx="176" cy="176" r="52"/>
      <circle cx="236" cy="134" r="62"/>
      <circle cx="304" cy="132" r="60"/>
      <circle cx="360" cy="170" r="52"/>
      <circle cx="402" cy="220" r="38"/>
      <circle cx="124" cy="226" r="40"/>
      <circle cx="206" cy="210" r="56"/>
      <circle cx="286" cy="200" r="62"/>
      <circle cx="346" cy="236" r="44"/>
      <circle cx="162" cy="262" r="34"/>
      <circle cx="246" cy="252" r="46"/>
      <circle cx="310" cy="262" r="38"/>
      <circle cx="96" cy="270" r="24"/>
      <circle cx="420" cy="266" r="24"/>
    </g>
    <clipPath id="crown-clip">
      <circle cx="176" cy="176" r="52"/>
      <circle cx="236" cy="134" r="62"/>
      <circle cx="304" cy="132" r="60"/>
      <circle cx="360" cy="170" r="52"/>
      <circle cx="402" cy="220" r="38"/>
      <circle cx="124" cy="226" r="40"/>
      <circle cx="206" cy="210" r="56"/>
      <circle cx="286" cy="200" r="62"/>
      <circle cx="346" cy="236" r="44"/>
      <circle cx="162" cy="262" r="34"/>
      <circle cx="246" cy="252" r="46"/>
      <circle cx="310" cy="262" r="38"/>
      <circle cx="96" cy="270" r="24"/>
      <circle cx="420" cy="266" r="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#disc)">
    <!-- Heavy sky. -->
    <rect width="512" height="512" fill="url(#sky)"/>
    <!-- Clouds: rounded tops, hatched bellies. -->
    <g stroke="#6a5842" stroke-width="2.5" stroke-linejoin="round">
      <path d="M24 116c10-22 36-28 52-14 10-24 46-28 60-6 18-12 44-4 48 16 14 0 24 10 22 22H24z" fill="#eadcb6"/>
      <path d="M24 124h182v12H24z" fill="url(#hatch-sky)" stroke="none"/>
      <path d="M340 186c6-12 22-16 32-8 8-12 28-12 36 0 12-4 24 4 24 14H340z" fill="#efe3c2"/>
    </g>
    <!-- Crows. -->
    <path d="M86 132q7-7 14 0q7-7 14 0M412 104q6-6 12 0q6-6 12 0M440 150q5-5 10 0q5-5 10 0" fill="none" stroke="#33281c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Distant hills. -->
    <path d="M0 336c50-20 100-24 150-14s80 2 120-6 90-10 130 2 80 12 112 6V512H0z" fill="#a9ab7c"/>
    <path d="M0 336c50-20 100-24 150-14s80 2 120-6 90-10 130 2 80 12 112 6" fill="none" stroke="#6a5842" stroke-width="2.5"/>

    <!-- Dry field. -->
    <path d="M0 372c80-14 170-16 256-12s180 2 256-6V512H0z" fill="url(#field)"/>
    <path d="M0 372c80-14 170-16 256-12s180 2 256-6" fill="none" stroke="#6a5842" stroke-width="2.5"/>
    <path d="M0 432c90-10 200-12 300-6s150 2 212-6V512H0z" fill="#33281c" opacity="0.06"/>

    <!-- The crown's shadow on the field. -->
    <ellipse cx="270" cy="404" rx="190" ry="26" fill="#33281c" opacity="0.18"/>

    <!-- The trunk: buttress roots, a gnarled bole splitting into great limbs. -->
    <g stroke="#33281c" stroke-linejoin="round" stroke-linecap="round">
      <path d="M196 404c22-6 34-20 38-46 4-34 0-62-6-92l-34-50 18-4 34 42 14-70 18 0-4 70 40-40 14 8-46 52c-8 34-10 62-4 92 4 24 18 36 42 40z" fill="#6b4f30" stroke-width="4"/>
      <path d="M268 404c4-24 2-60 10-96 4-20 2-32-4-42" fill="none" stroke-width="2.2" opacity="0.7"/>
      <path d="M268 330c10-4 22 0 30 8M244 380c-8-14-6-30 2-44" fill="none" stroke-width="2" opacity="0.7"/>
      <path d="M262 316c14-10 22-4 30 4 4 8 4 18-2 26" fill="url(#hatch)" stroke="none"/>
      <!-- A hollow where a branch broke off long ago. -->
      <path d="M244 300c4-10 14-12 20-6 4 8 0 18-8 22-8 2-14-6-12-16z" fill="#2a2016" stroke-width="2.6"/>
    </g>

    <!-- The crown: billows outlined once, then filled over, shaded underneath. -->
    <use href="#crown" fill="none" stroke="#33281c" stroke-width="7"/>
    <use href="#crown" fill="#7d8a52"/>
    <g clip-path="url(#crown-clip)">
      <path d="M40 250h460v120H40z" fill="#5c6a2c" opacity="0.55"/>
      <path d="M40 260h460v120H40z" fill="url(#hatch)" opacity="0.6"/>
      <g fill="#9aa46a" opacity="0.55">
      <circle cx="160" cy="156" r="16"/>
      <circle cx="217" cy="110" r="19"/>
      <circle cx="286" cy="109" r="18"/>
      <circle cx="344" cy="150" r="16"/>
      <circle cx="189" cy="189" r="17"/>
      <circle cx="267" cy="176" r="19"/>
      <circle cx="333" cy="219" r="13"/>
      <circle cx="232" cy="235" r="14"/>
      </g>
    </g>
    <path d="M140 199q36 23 73 0M193 162q43 28 87 0M262 159q42 27 84 0M324 193q36 23 73 0M375 237q27 17 53 0M96 244q28 18 56 0M167 235q39 25 78 0M243 228q43 28 87 0M315 256q31 20 62 0M138 277q24 15 48 0M214 273q32 21 64 0M283 279q27 17 53 0M79 281q17 11 34 0M403 277q17 11 34 0" fill="none" stroke="#33281c" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <!-- The rope swing: one rope snapped, the seat hanging askew. -->
    <g stroke="#33281c" stroke-linecap="round" stroke-linejoin="round">
      <path d="M156 264V352M196 262V320" fill="none" stroke-width="2.4"/>
      <path d="M196 320c2 6-2 10-6 12" fill="none" stroke-width="2.4"/>
      <path d="M144 352l28-4 2 8-28 4z" fill="#8b6a42" stroke-width="2.6"/>
    </g>

    <!-- A boundary stone in the oak's shade. -->
    <g stroke="#33281c" stroke-linejoin="round">
      <path d="M352 410v-34q0-12 12-12t12 12v34z" fill="#b9b2a2" stroke-width="3.2"/>
      <path d="M358 384h12M364 378v14" stroke-width="2.2"/>
    </g>

    <!-- Tall dry grass. -->
    <g fill="none" stroke="#5c6a2c" stroke-width="2.6" stroke-linecap="round">
      <path d="M40 470c4-20 8-32 16-44M50 474c2-18 2-30-2-44M62 472c4-14 10-24 18-30"/>
      <path d="M430 476c4-16 8-26 16-34M442 478c0-14-2-24-6-32M454 476c4-12 8-20 16-24"/>
    </g>
  </g>

  <!-- The medallion's frame. -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="#33281c" stroke-width="5"/>
  <circle cx="256" cy="256" r="244" fill="none" stroke="#33281c" stroke-width="9"/>
  <circle cx="256" cy="256" r="238" fill="none" stroke="#ece0c0" stroke-width="3"/>
</svg>
