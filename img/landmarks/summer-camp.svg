      <path d="M484 190 489.7 230 486.9 220 495.4 270 489.7 260 501.1 310 492.6 300 506.9 350 495.4 340 512.6 390 498.3 380 518.3 430 501.1 420 524 470 444 470 466.9 420 449.7 430 469.7 380 455.4 390 472.6 340 461.1 350 475.4 300 466.9 310 478.3 260 472.6 270 481.1 220 478.3 230z" fill="#6f7f45" stroke="#33281c" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M484 190 489.7 230 486.9 220 495.4 270 489.7 260 501.1 310 492.6 300 506.9 350 495.4 340 512.6 390 498.3 380 518.3 430 501.1 420 524 470 484 470z" fill="url(#hatch)" opacity="0.7"/>
