      <path d="M32 170 37.7 212.9 34.9 202.1 43.4 255.7 37.7 245 49.1 298.6 40.6 287.9 54.9 341.4 43.4 330.7 60.6 384.3 46.3 373.6 66.3 427.1 49.1 416.4 72 470 32 470z" fill="url(#hatch)" opacity="0.7"/>
