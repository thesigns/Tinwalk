      <path d="M30 160 35 186.7 32.5 180 40 213.3 35 206.7 45 240 37.5 233.3 50 266.7 40 260 55 293.3 42.5 286.7 60 320 30 320z" fill="url(#hatch)" opacity="0.7"/>
      <path d="M93 312V324h6V312z" fill="#5e4428" stroke="#33281c" stroke-width="2.2" stroke-linejoin="round"/>
