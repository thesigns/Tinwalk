      <path d="M344 204 398 236 440 290 460 420H330l20-90z" fill="url(#hatch)" stroke="none"/>
      <!-- Moss over the top. -->
      <path d="M96 250 150 214 210 196 280 190 344 204 398 236 412 254q-30-8-60-2-26-14-60-10-30-10-62-4-34-8-62 6-30 0-48 22z" fill="#7d8a52" stroke-width="3"/>
      <!-- Cracks and ledges. -->
      <path d="M90 300l30 10 20-8M380 300l20 14 24-4M110 360l26-6M392 370l30 6M170 250l20 18M350 250l-16 22" fill="none" stroke-width="2.4"/>
    </g>

    <!-- Soot on the rock above the mouth. -->
    <ellipse cx="256" cy="262" rx="70" ry="40" fill="url(#soot)"/>

    <!-- The mouth. -->
    <path d="M176 424V340q0-74 80-78 80 4 80 78v84z" fill="url(#dark)" stroke="#33281c" stroke-width="4" stroke-linejoin="round"/>
    <path d="M196 424V350q0-56 60-62" fill="none" stroke="#5e5a52" stroke-width="3" opacity="0.6"/>
    <!-- Roots hanging over it. -->
    <g fill="none" stroke="#5e4428" stroke-width="2.6" stroke-linecap="round">
      <path d="M210 270q-6 20 2 40M236 262q4 22-4 44M282 264q6 18 0 36M304 272q-4 16 4 30"/>
    </g>
    <!-- Cold air drifting out. -->
    <g fill="none" stroke="#f3e9cc" stroke-width="2.4" stroke-linecap="round" opacity="0.55">
      <path d="M220 380q20-8 40 0t40 0M232 398q16-6 32 0t32 0"/>
    </g>

    <!-- The fire ring with fresh ash, firewood stacked by the entrance. -->
    <g stroke="#33281c" stroke-linejoin="round" stroke-linecap="round">
      <ellipse cx="250" cy="452" rx="42" ry="13" fill="#5e5a4a" stroke-width="2.6"/>
      <ellipse cx="250" cy="450" rx="28" ry="7" fill="#b9b2a2" stroke-width="2"/>
      <path d="M232 448l30-4M238 454l24 2" stroke="#2a2016" stroke-width="5"/>
      <g fill="#a39d90" stroke-width="2.2">
        <circle cx="210" cy="452" r="7"/><circle cx="222" cy="464" r="7"/><circle cx="246" cy="468" r="7"/>
        <circle cx="270" cy="466" r="7"/><circle cx="290" cy="456" r="7"/><circle cx="286" cy="442" r="6"/>
