      <path d="M318 112 322.4 127.6 320.2 123.7 326.8 143.2 322.4 139.3 331.2 158.8 324.6 154.9 335.6 174.4 326.8 170.5 340 190 318 190z" fill="url(#hatch)" opacity="0.7"/>
    </g>

    <!-- The rock face. -->
