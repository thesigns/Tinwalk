      <path d="M150 106h152v10H150z" fill="url(#hatch-sky)" stroke="none"/>
    </g>
    <path d="M330 120q6-6 12 0q6-6 12 0" fill="none" stroke="#33281c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

