      <path d="M96 180 100.5 202 98.2 196.5 105 224 100.5 218.5 109.5 246 102.8 240.5 114 268 105 262.5 118.5 290 107.2 284.5 123 312 96 312z" fill="url(#hatch)" opacity="0.7"/>
