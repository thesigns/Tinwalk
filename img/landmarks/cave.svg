      <path d="M31 470V482h6V470z" fill="#5e4428" stroke="#33281c" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M34 170 39.7 212.9 36.9 202.1 45.4 255.7 39.7 245 51.1 298.6 42.6 287.9 56.9 341.4 45.4 330.7 62.6 384.3 48.3 373.6 68.3 427.1 51.1 416.4 74 470 -6 470 16.9 416.4 -0.3 427.1 19.7 373.6 5.4 384.3 22.6 330.7 11.1 341.4 25.4 287.9 16.9 298.6 28.3 245 22.6 255.7 31.1 202.1 28.3 212.9z" fill="#6f7f45" stroke="#33281c" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M34 170 39.7 212.9 36.9 202.1 45.4 255.7 39.7 245 51.1 298.6 42.6 287.9 56.9 341.4 45.4 330.7 62.6 384.3 48.3 373.6 68.3 427.1 51.1 416.4 74 470 34 470z" fill="url(#hatch)" opacity="0.7"/>
      <path d="M477 470V482h6V470z" fill="#5e4428" stroke="#33281c" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M480 160 486 204.3 483 193.2 492 248.6 486 237.5 498 292.9 489 281.8 504 337.1 492 326.1 510 381.4 495 370.4 516 425.7 498 414.6 522 470 438 470 462 414.6 444 425.7 465 370.4 450 381.4 468 326.1 456 337.1 471 281.8 462 292.9 474 237.5 468 248.6 477 193.2 474 204.3z" fill="#6f7f45" stroke="#33281c" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M480 160 486 204.3 483 193.2 492 248.6 486 237.5 498 292.9 489 281.8 504 337.1 492 326.1 510 381.4 495 370.4 516 425.7 498 414.6 522 470 480 470z" fill="url(#hatch)" opacity="0.7"/>
    </g>
  </g>

  <!-- The medallion's frame. -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="#33281c" stroke-width="5"/>
  <circle cx="256" cy="256" r="244" fill="none" stroke="#33281c" stroke-width="9"/>
  <circle cx="256" cy="256" r="238" fill="none" stroke="#ece0c0" stroke-width="3"/>
</svg>
