    <path d="M0 340q11 -21.8 22 0q14.5 -20 29 0q10.5 -26 21 0q14 -24.2 28 0q10 -22.4 20 0q13.5 -20.5 27 0q9.5 -26.5 19 0q13 -24.7 26 0q9 -22.9 18 0q12.5 -21.1 25 0q8.5 -27 17 0q12 -25.2 24 0q8 -23.4 16 0q11.5 -21.6 23 0q15 -19.8 30 0q11 -25.7 22 0q14.5 -23.9 29 0q10.5 -22.1 21 0q14 -20.3 28 0q10 -26.3 20 0q13.5 -24.4 27 0q9.5 -22.6 19 0q13 -20.8 26 0V352H0z" fill="#7d8a52" stroke="#33281c" stroke-width="2.4" stroke-linejoin="round"/>
