      <path d="M430 300l14-6 4 14-12 4z" fill="#2a2016" stroke-width="2"/>
      <path d="M400 268v-12" stroke-width="3"/>
      <path d="M400 256l12 4-12 4z" fill="#b4432b" stroke-width="1.6"/>
    </g>
    <!-- Weeds in the cracks. -->
    <g fill="none" stroke="#5c6a2c" stroke-width="2.6" stroke-linecap="round">
      <path d="M70 470c2-12 6-20 12-26M78 472c0-12-2-20-6-26M86 470c4-8 8-14 14-16"/>
      <path d="M420 470c2-14 6-22 12-28M430 472c0-14-2-22-8-30M440 470c4-10 10-16 16-18"/>
    </g>
  </g>

  <!-- The medallion's frame. -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="#33281c" stroke-width="5"/>
  <circle cx="256" cy="256" r="244" fill="none" stroke="#33281c" stroke-width="9"/>
  <circle cx="256" cy="256" r="238" fill="none" stroke="#ece0c0" stroke-width="3"/>
</svg>
