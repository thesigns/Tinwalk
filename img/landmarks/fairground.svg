        <path d="M0 0v8" stroke-width="2"/>
        <path d="M-12 8h24l-2 18h-20z" fill="#b4432b" stroke-width="2.6"/>
        <path d="M-14 8h28" stroke-width="3"/>
        <path d="M-8 13h16" stroke-width="1.6"/>
      </g>
      <g transform="translate(297.4 112.6) rotate(0)">
        <path d="M0 0v8" stroke-width="2"/>
        <path d="M-12 8h24l-2 18h-20z" fill="#e0bd68" stroke-width="2.6"/>
        <path d="M-14 8h28" stroke-width="3"/>
        <path d="M-8 13h16" stroke-width="1.6"/>
      </g>
      <g transform="translate(332 196) rotate(0)">
        <path d="M0 0v8" stroke-width="2"/>
        <path d="M-12 8h24l-2 18h-20z" fill="#7d8a52" stroke-width="2.6"/>
        <path d="M-14 8h28" stroke-width="3"/>
        <path d="M-8 13h16" stroke-width="1.6"/>
      </g>
      <g transform="translate(297.4 279.4) rotate(18)">
        <path d="M0 0v8" stroke-width="2"/>
        <path d="M-12 8h24l-2 18h-20z" fill="#b4432b" stroke-width="2.6"/>
        <path d="M-14 8h28" stroke-width="3"/>
        <path d="M-8 13h16" stroke-width="1.6"/>
      </g>
      <g transform="translate(130.6 279.4) rotate(0)">
        <path d="M0 0v8" stroke-width="2"/>
        <path d="M-12 8h24l-2 18h-20z" fill="#e0bd68" stroke-width="2.6"/>
        <path d="M-14 8h28" stroke-width="3"/>
        <path d="M-8 13h16" stroke-width="1.6"/>
      </g>
      <g transform="translate(96 196) rotate(0)">
        <path d="M0 0v8" stroke-width="2"/>
        <path d="M-12 8h24l-2 18h-20z" fill="#b4432b" stroke-width="2.6"/>
        <path d="M-14 8h28" stroke-width="3"/>
        <path d="M-8 13h16" stroke-width="1.6"/>
      </g>
      <g transform="translate(130.6 112.6) rotate(-6)">
        <path d="M0 0v8" stroke-width="2"/>
        <path d="M-12 8h24l-2 18h-20z" fill="#7d8a52" stroke-width="2.6"/>
        <path d="M-14 8h28" stroke-width="3"/>
        <path d="M-8 13h16" stroke-width="1.6"/>
      </g>
    </g>
    <!-- The car that fell, lying in the grass. -->
    <g transform="translate(86 432) rotate(-70)" stroke="#33281c" stroke-linejoin="round">
      <path d="M-12 8h24l-2 18h-20z" fill="#7d8a52" stroke-width="2.6"/>
      <path d="M-14 8h28" stroke-width="3"/>
    </g>

    <!-- Faded bunting from the wheel to the carousel. -->
    <path d="M214 196q100 70 186 72" fill="none" stroke="#33281c" stroke-width="1.4"/>
    <g fill="#c98a72" stroke="#33281c" stroke-width="1.2" stroke-linejoin="round">
      <path d="M244 220l4 12 6-10zM274 238l2 12 8-8zM306 252l2 12 8-10zM340 262l2 12 8-10zM372 266l2 12 8-10z"/>
    </g>

    <!-- The carousel: platform, horses on their poles, a torn striped canopy. -->
    <g stroke="#33281c" stroke-linejoin="round" stroke-linecap="round">
      <path d="M324 404a76 14 0 0 0 152 0v10a76 14 0 0 1-152 0z" fill="#8b6a42" stroke-width="3"/>
      <ellipse cx="400" cy="404" rx="76" ry="14" fill="#a07a4c" stroke-width="3"/>
      <path d="M400 320v84" stroke-width="5"/>
      <g transform="translate(352 372) scale(1.5)">
        <path d="M0-34V22" stroke-width="1.4"/>
        <path d="M-10 7V1M-7 7l1-6M5 7l-1-6M8 7V1" stroke-width="1.6" fill="none"/>
        <path d="M-12-3q0-3 3-3h14l4-7q2-2 4 0l1 3-3 3-1 2v5q0 2-2 2h-18q-2 0-2-2z" fill="#efe6cf" stroke-width="1.6"/>
        <path d="M-12-2-15 4" stroke-width="1.6" fill="none"/>
        <path d="M-4-6h8v-3h-8z" fill="#b4432b" stroke-width="1.2"/>
      </g>
      <g transform="translate(446 368) scale(1.5)">
        <path d="M0-34V22" stroke-width="1.4"/>
        <path d="M-10 7V1M-7 7l1-6M5 7l-1-6M8 7V1" stroke-width="1.6" fill="none"/>
        <path d="M-12-3q0-3 3-3h14l4-7q2-2 4 0l1 3-3 3-1 2v5q0 2-2 2h-18q-2 0-2-2z" fill="#e0bd68" stroke-width="1.6"/>
        <path d="M-12-2-15 4" stroke-width="1.6" fill="none"/>
        <path d="M-4-6h8v-3h-8z" fill="#b4432b" stroke-width="1.2"/>
      </g>
      <g transform="translate(400 380) scale(1.3)">
        <path d="M0-34V22" stroke-width="1.4"/>
        <path d="M-10 7V1M-7 7l1-6M5 7l-1-6M8 7V1" stroke-width="1.6" fill="none"/>
        <path d="M-12-3q0-3 3-3h14l4-7q2-2 4 0l1 3-3 3-1 2v5q0 2-2 2h-18q-2 0-2-2z" fill="#cdc6b4" stroke-width="1.6"/>
        <path d="M-12-2-15 4" stroke-width="1.6" fill="none"/>
        <path d="M-4-6h8v-3h-8z" fill="#b4432b" stroke-width="1.2"/>
      </g>
      <path d="M330 320 400 268 470 320z" fill="#efe6cf" stroke-width="3"/>
      <path d="M400 268L330 320L347.5 320zM400 268L365 320L382.5 320zM400 268L400 320L417.5 320zM400 268L435 320L452.5 320z" fill="#b4432b" stroke="none"/>
      <path d="M330 320 400 268 470 320" fill="none" stroke-width="3"/>
      <path d="M330 320q8.8 12 17.5 0q8.8 12 17.5 0q8.8 12 17.5 0q8.8 12 17.5 0q8.8 12 17.5 0q8.8 12 17.5 0q8.8 12 17.5 0q8.8 12 17.5 0" fill="#e0bd68" stroke-width="2.4"/>
