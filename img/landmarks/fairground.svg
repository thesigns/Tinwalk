<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- An abandoned fairground in the ruins: a Ferris wheel stopped with its cars still swinging, some fallen off, a carousel with a torn striped canopy and smiling horses frozen mid-gallop, faded bunting strung between them. -->
  <defs>
    <clipPath id="disc"><circle cx="256" cy="256" r="232"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdb98c"/>
      <stop offset="0.45" stop-color="#e6d7b0"/>
      <stop offset="0.7" stop-color="#f3e9cc"/>
    </linearGradient>
    <linearGradient id="asphalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9d968a"/>
      <stop offset="1" stop-color="#857e72"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9ab7c"/>
      <stop offset="1" stop-color="#8b8d5e"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cbc2ad"/>
      <stop offset="1" stop-color="#b3a992"/>
    </linearGradient>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0v7" stroke="#33281c" stroke-width="1.6" opacity="0.55"/>
    </pattern>
    <pattern id="hatch-sky" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)">
      <path d="M0 0v8" stroke="#6a5842" stroke-width="1.4" opacity="0.45"/>
    </pattern>
  </defs>

  <g clip-path="url(#disc)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <g stroke="#6a5842" stroke-width="2.5" stroke-linejoin="round">
      <path d="M268 92c10-22 36-28 52-14 10-24 46-28 60-6 18-12 44-4 48 16 14 0 24 10 22 22H268z" fill="#eadcb6"/>
      <path d="M268 100h182v12H268z" fill="url(#hatch-sky)" stroke="none"/>
    </g>
    <path d="M150 110q7-7 14 0q7-7 14 0M190 92q5-5 10 0q5-5 10 0" fill="none" stroke="#33281c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Ruined blocks in the distance. -->
    <g fill="#b9b2a2" stroke="#6a5842" stroke-width="2.5" stroke-linejoin="round">
      <path d="M0 330V220h40l8 10 8-14h46V330z"/>
      <path d="M396 330V214h30l6 12 10-8h70V330z"/>
    </g>
    <g fill="#8a8377">
      <path d="M12 236h10v12H12zM52 236h10v12H52zM32 260h10v12H32zM72 260h10v12H72zM12 284h10v12H12zM52 284h10v12H52z"/>
      <path d="M440 232h10v12h-10zM480 232h10v12h-10zM460 256h10v12h-10zM440 280h10v12h-10zM480 280h10v12h-10z"/>
    </g>

    <!-- Ground gone back to grass. -->
    <path d="M0 330H512V512H0z" fill="url(#grass)"/>
    <path d="M0 330H512" stroke="#33281c" stroke-width="2.5"/>
    <path d="M0 410c90-10 200-12 300-6s150 2 212-6V512H0z" fill="#33281c" opacity="0.06"/>

    <!-- The wheel's legs, the far pair fainter. -->
    <g stroke="#33281c" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M214 196 168 410M214 196 262 410" stroke="#6a5842" stroke-width="5" opacity="0.6"/>
      <path d="M214 196 150 414M214 196 280 414" stroke-width="9"/>
      <path d="M214 196 150 414M214 196 280 414" stroke="#cdc6b4" stroke-width="5"/>
      <path d="M170 350h90M186 300h56" stroke-width="3"/>
    </g>

    <!-- The wheel: a double rim, spokes and the hub. -->
    <g fill="none" stroke="#33281c" stroke-linecap="round">
      <circle cx="214" cy="196" r="118" stroke-width="5"/>
      <circle cx="214" cy="196" r="106" stroke-width="2.4"/>
      <path d="M214 196L332 196M214 196L323 241.2M214 196L297.4 279.4M214 196L259.2 305M214 196L214 314M214 196L168.8 305M214 196L130.6 279.4M214 196L105 241.2M214 196L96 196M214 196L105 150.8M214 196L130.6 112.6M214 196L168.8 87M214 196L214 78M214 196L259.2 87M214 196L297.4 112.6M214 196L323 150.8" stroke-width="2"/>
      <path d="M214 196L318 216.7M214 196L302.1 254.9M214 196L272.9 284.1M214 196L234.7 300M214 196L193.3 300M214 196L155.1 284.1M214 196L125.9 254.9M214 196L110 216.7M214 196L110 175.3M214 196L125.9 137.1M214 196L155.1 107.9M214 196L193.3 92M214 196L234.7 92M214 196L272.9 107.9M214 196L302.1 137.1M214 196L318 175.3" stroke-width="1.2" opacity="0.6"/>
