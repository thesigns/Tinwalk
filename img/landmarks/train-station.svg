<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- A railway station in the ruins: a brick hall with its clock stopped at a quarter past six, an iron canopy over the platform, a bench, and one passenger carriage still waiting on the track with no engine to pull it. -->
  <defs>
    <clipPath id="disc"><circle cx="256" cy="256" r="232"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdb98c"/>
      <stop offset="0.45" stop-color="#e6d7b0"/>
      <stop offset="0.7" stop-color="#f3e9cc"/>
    </linearGradient>
    <linearGradient id="asphalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9d968a"/>
      <stop offset="1" stop-color="#857e72"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9ab7c"/>
      <stop offset="1" stop-color="#8b8d5e"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cbc2ad"/>
      <stop offset="1" stop-color="#b3a992"/>
    </linearGradient>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0v7" stroke="#33281c" stroke-width="1.6" opacity="0.55"/>
    </pattern>
    <pattern id="hatch-sky" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)">
      <path d="M0 0v8" stroke="#6a5842" stroke-width="1.4" opacity="0.45"/>
    </pattern>
    <linearGradient id="brick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a6448"/>
      <stop offset="1" stop-color="#a86f50"/>
    </linearGradient>
    <pattern id="bricks" width="20" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 0h20M0 5h20M0 0v5M10 5v5" stroke="#4a2c1c" stroke-width="1.2" opacity="0.45" fill="none"/>
    </pattern>
  </defs>

  <g clip-path="url(#disc)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <g stroke="#6a5842" stroke-width="2.5" stroke-linejoin="round">
      <path d="M268 92c10-22 36-28 52-14 10-24 46-28 60-6 18-12 44-4 48 16 14 0 24 10 22 22H268z" fill="#eadcb6"/>
      <path d="M268 100h182v12H268z" fill="url(#hatch-sky)" stroke="none"/>
    </g>
    <path d="M150 110q7-7 14 0q7-7 14 0M190 92q5-5 10 0q5-5 10 0" fill="none" stroke="#33281c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Ruined blocks in the distance. -->
    <g fill="#b9b2a2" stroke="#6a5842" stroke-width="2.5" stroke-linejoin="round">
      <path d="M0 330V220h40l8 10 8-14h46V330z"/>
      <path d="M396 330V214h30l6 12 10-8h70V330z"/>
    </g>
    <g fill="#8a8377">
      <path d="M12 236h10v12H12zM52 236h10v12H52zM32 260h10v12H32zM72 260h10v12H72zM12 284h10v12H12zM52 284h10v12H52z"/>
      <path d="M440 232h10v12h-10zM480 232h10v12h-10zM460 256h10v12h-10zM440 280h10v12h-10zM480 280h10v12h-10z"/>
    </g>

    <!-- Gravel and the track bed. -->
    <path d="M0 330H512V512H0z" fill="url(#asphalt)"/>
    <path d="M0 330H512" stroke="#33281c" stroke-width="2.5"/>

    <!-- The hall: brick, a gable with the clock, arched windows and doors. -->
    <g stroke="#33281c" stroke-linejoin="round" stroke-linecap="round">
      <path d="M110 372V236h292v136z" fill="url(#brick)" stroke-width="3.5"/>
      <path d="M110 236h292v136H110z" fill="url(#bricks)" stroke="none"/>
      <path d="M190 236 256 162 322 236z" fill="url(#brick)" stroke-width="3.5"/>
      <path d="M190 236 256 162 322 236z" fill="url(#bricks)" stroke="none"/>
      <path d="M98 240 256 140 414 240" fill="none" stroke-width="3"/>
      <path d="M102 238h308v-10H102z" fill="#6b665c" stroke-width="3"/>
      <!-- The clock, stopped at a quarter past six. -->
      <circle cx="256" cy="192" r="24" fill="#efe6cf" stroke-width="3.5"/>
      <path d="M256 172v4M276 192h-4M256 212v-4M236 192h4" stroke-width="2"/>
      <path d="M256 192L254.3 204.9" stroke-width="3.5"/>
      <path d="M256 192L275 192" stroke-width="2.4"/>
      <circle cx="256" cy="192" r="2.6" fill="#33281c"/>
      <!-- Arched windows and the doors. -->
      <path d="M130 300v-32q0-12 12-12t12 12v32zM170 300v-32q0-12 12-12t12 12v32zM318 300v-32q0-12 12-12t12 12v32zM358 300v-32q0-12 12-12t12 12v32z" fill="#2a2016" stroke-width="2.6"/>
      <path d="M232 372v-60q0-24 24-24t24 24v60z" fill="#2a2016" stroke-width="3"/>
      <path d="M256 288v84" stroke="#5e4428" stroke-width="3"/>
    </g>

    <!-- The platform edge. -->
    <path d="M0 384h512v12H0z" fill="#b9b2a2" stroke="#33281c" stroke-width="2.5"/>
    <!-- The iron canopy on its columns, a sign hanging from it. -->
    <g stroke="#33281c" stroke-linejoin="round" stroke-linecap="round">
      <path d="M40 384V286M150 384V286" stroke-width="5"/>
      <path d="M20 280h150l-8 12H28z" fill="#6b665c" stroke-width="3"/>
      <path d="M40 300l14-14M150 300l-14-14" stroke-width="2.4"/>
      <path d="M86 292v10M110 292v10" stroke-width="1.8"/>
      <path d="M78 302h40v14H78z" fill="#efe6cf" stroke-width="2.4"/>
    </g>
    <!-- A bench on the platform. -->
    <g stroke="#33281c" stroke-linejoin="round" stroke-linecap="round">
      <path d="M62 364h56M62 352h56" stroke-width="5"/>
      <path d="M66 384v-32M114 384v-32" stroke-width="3"/>
    </g>

    <!-- The track: sleepers and two rails. -->
    <g stroke="#33281c" stroke-linecap="round">
      <path d="M10 424l-6 22M50 424l-4 22M90 424l-2 22M130 424v22M170 424v22M210 424v22M250 424v22M290 424v22M330 424v22M370 424v22M410 424l2 22M450 424l4 22M490 424l6 22" stroke="#6b4f30" stroke-width="7"/>
      <path d="M0 428h512M0 442h512" stroke-width="4"/>
    </g>

    <!-- The carriage waiting at the platform, no engine to pull it. -->
    <g stroke="#33281c" stroke-linejoin="round" stroke-linecap="round">
      <path d="M232 418V340q0-10 10-12h260v90z" fill="#7d8a52" stroke-width="3.5"/>
      <path d="M232 340q0-10 10-12h260v10H232z" fill="#5c6a2c" stroke-width="3"/>
      <path d="M248 352h28v22h-28zM292 352h28v22h-28zM336 352h28v22h-28zM380 352h28v22h-28zM424 352h28v22h-28z" fill="#2a2016" stroke-width="2.4"/>
      <path d="M232 392h270" stroke-width="2" opacity="0.6"/>
      <path d="M232 400h-12v8h12" fill="none" stroke-width="3"/>
      <circle cx="270" cy="424" r="10" fill="#2a2016" stroke-width="3"/>
      <circle cx="302" cy="424" r="10" fill="#2a2016" stroke-width="3"/>
      <circle cx="440" cy="424" r="10" fill="#2a2016" stroke-width="3"/>
      <circle cx="472" cy="424" r="10" fill="#2a2016" stroke-width="3"/>
      <path d="M262 360l10-6M350 358l8 10" stroke="#82301c" stroke-width="4" opacity="0.4"/>
    </g>
    <!-- Weeds in the cracks. -->
    <g fill="none" stroke="#5c6a2c" stroke-width="2.6" stroke-linecap="round">
      <path d="M70 470c2-12 6-20 12-26M78 472c0-12-2-20-6-26M86 470c4-8 8-14 14-16"/>
      <path d="M420 470c2-14 6-22 12-28M430 472c0-14-2-22-8-30M440 470c4-10 10-16 16-18"/>
    </g>
  </g>

  <!-- The medallion's frame. -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="#33281c" stroke-width="5"/>
  <circle cx="256" cy="256" r="244" fill="none" stroke="#33281c" stroke-width="9"/>
  <circle cx="256" cy="256" r="238" fill="none" stroke="#ece0c0" stroke-width="3"/>
</svg>
