<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- A looted pharmacy in an old tenement: smashed display windows, a sign missing a letter,
       a green cross hanging by one chain, a half-drawn shutter with NO MEDS sprayed in red,
       and an overturned shopping cart among spilled pill boxes. -->
  <defs>
    <clipPath id="disc"><circle cx="256" cy="256" r="232"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdb98c"/>
      <stop offset="0.45" stop-color="#e6d7b0"/>
      <stop offset="0.7" stop-color="#f3e9cc"/>
    </linearGradient>
    <linearGradient id="asphalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9d968a"/>
      <stop offset="1" stop-color="#857e72"/>
    </linearGradient>
    <linearGradient id="plaster" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d3bf92"/>
      <stop offset="1" stop-color="#bba67a"/>
    </linearGradient>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0v7" stroke="#33281c" stroke-width="1.6" opacity="0.55"/>
    </pattern>
    <pattern id="hatch-sky" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)">
      <path d="M0 0v8" stroke="#6a5842" stroke-width="1.4" opacity="0.45"/>
    </pattern>
    <pattern id="bricks" width="16" height="8" patternUnits="userSpaceOnUse">
      <rect width="16" height="8" fill="#8f6c50"/>
      <path d="M0 0h16M0 4h16M4 0v4M12 4v4" stroke="#5e4428" stroke-width="1"/>
    </pattern>
    <!-- A tall tenement window, 26 by 46, from its top-left corner. -->
    <g id="window" stroke="#33281c" stroke-linejoin="round">
      <path d="M-4-6h34v6H-4z" fill="#b5a072" stroke-width="2.2"/>
      <path d="M0 0h26v46H0z" fill="#2a2016" stroke-width="3"/>
      <path d="M13 0v46M0 18h26" stroke="#6a5842" stroke-width="2"/>
      <path d="M-4 46h34v5H-4z" fill="#a39d90" stroke-width="2.2"/>
    </g>
    <g id="window-glass" stroke="#33281c" stroke-linejoin="round">
      <path d="M-4-6h34v6H-4z" fill="#b5a072" stroke-width="2.2"/>
      <path d="M0 0h26v46H0z" fill="#8fa0a0" stroke-width="3"/>
      <path d="M0 18h26v28H0z" fill="#2a2016" stroke-width="2"/>
      <path d="M0 18l8 8 5-6 6 10 7-8" fill="#8fa0a0" stroke-width="1.6"/>
      <path d="M13 0v18" stroke="#6a5842" stroke-width="2"/>
      <path d="M-4 46h34v5H-4z" fill="#a39d90" stroke-width="2.2"/>
    </g>
  </defs>

  <g clip-path="url(#disc)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <g stroke="#6a5842" stroke-width="2.5" stroke-linejoin="round">
      <path d="M326 70c8-18 30-24 44-12 10-20 40-22 52-4 16-8 36 2 38 18 12 0 20 8 18 18H326z" fill="#eadcb6"/>
      <path d="M326 80h152v10H326z" fill="url(#hatch-sky)" stroke="none"/>
    </g>
    <path d="M60 150q6-6 12 0q6-6 12 0M440 170q5-5 10 0q5-5 10 0" fill="none" stroke="#33281c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Ruined blocks in the distance. -->
    <g fill="#b9b2a2" stroke="#6a5842" stroke-width="2.5" stroke-linejoin="round">
      <path d="M0 340V196h30l10 12 8-10h26V340z"/>
      <path d="M420 340V214h34l8 12 10-8h40V340z"/>
    </g>
    <g fill="#8a8377">
      <path d="M10 212h10v12H10zM40 212h10v12H40zM10 240h10v12H10zM56 240h10v12H56zM26 268h10v12H26zM56 268h10v12H56zM10 296h10v12H10zM40 296h10v12H40z"/>
      <path d="M432 232h10v12h-10zM460 232h10v12h-10zM488 248h10v12h-10zM432 262h10v12h-10zM476 276h10v12h-10zM432 300h10v12h-10zM460 300h10v12h-10z"/>
    </g>

    <!-- Pavement and the street. -->
    <path d="M0 340H512V512H0z" fill="url(#asphalt)"/>
    <path d="M0 340H512V384H0z" fill="#b3ac9c"/>
    <path d="M0 340H512M0 384H512" stroke="#33281c" stroke-width="2.5"/>
    <path d="M40 340l-10 44M100 340l-6 44M160 340l-2 44M220 340v44M280 340l2 44M340 340l6 44M400 340l10 44M460 340l14 44M0 362H512" stroke="#6a5842" stroke-width="1.4" opacity="0.6"/>
    <g fill="none" stroke="#5f594f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M60 430l30 10 14 22M300 440l28-8 18 14 30-4M180 486l24-10 30 6"/>
    </g>

    <!-- The building and its shop front, scaled down from its base to fit under the frame. -->
    <g transform="translate(240 344) scale(0.88) translate(-240 -344)">
    <!-- Shadow of the building. -->
    <path d="M96 344H420l30 12H120z" fill="#33281c" opacity="0.22"/>

    <!-- The tenement, seen three-quarter. -->
    <g stroke="#33281c" stroke-linejoin="round" stroke-linecap="round">
      <!-- Side wall, in shade. -->
      <path d="M352 88 420 104V334L352 344z" fill="#a8946a" stroke-width="3.5"/>
      <path d="M352 88 420 104V334L352 344z" fill="url(#hatch)" stroke="none"/>
      <path d="M366 118l20 4v38l-20-3zM366 196l20 3v38l-20-2zM394 124l16 3v36l-16-2zM394 200l16 2v36l-16-2z" fill="#2a2016" stroke-width="2.5"/>
      <path d="M352 256 420 262" stroke-width="2.5"/>

      <!-- Front wall of old plaster. -->
      <path d="M96 88H352V344H96z" fill="url(#plaster)" stroke-width="3.5"/>
      <!-- Plaster fallen away, bricks showing. -->
      <path d="M110 150c10-6 24-4 30 4 4 10-2 20-14 22-12 0-20-10-16-26zM300 200c12-4 24 0 28 10s-4 18-16 18c-10-2-16-14-12-28z" fill="url(#bricks)" stroke-width="2"/>
      <!-- Floor bands and the cornice. -->
      <path d="M96 172H352M96 252H352" stroke-width="2.5"/>
      <path d="M90 78H260l8 8 10-8h82v12H90z" fill="#b5a072" stroke-width="3"/>
      <path d="M90 90H360" stroke-width="2"/>
      <!-- Damp stains running down. -->
      <path d="M180 92v40M240 92l-2 26M330 176v30" stroke="#8a7348" stroke-width="4" opacity="0.5"/>
    </g>

    <!-- Upper floor windows. -->
    <use href="#window" x="118" y="108"/>
    <use href="#window-glass" x="172" y="108"/>
    <use href="#window" x="226" y="108"/>
    <use href="#window" x="280" y="108"/>
    <use href="#window-glass" x="118" y="190"/>
    <use href="#window" x="172" y="190"/>
    <use href="#window" x="280" y="190"/>
    <!-- A torn curtain hanging out of a broken window. -->
    <path d="M254 110c10 4 16 12 16 22-2 10 2 20 8 26-10 2-18-4-20-14-4-8-6-20-4-34z" fill="#ece0c0" stroke="#33281c" stroke-width="2" stroke-linejoin="round"/>
    <!-- A balcony with a rusted railing, one corner dropped. -->
    <g stroke="#33281c" stroke-linejoin="round" stroke-linecap="round" fill="none">
      <path d="M216 240h54l2 6-58 10z" fill="#a39d90" stroke-width="2.5"/>
      <path d="M216 240 214 214h58v26" stroke-width="2.5"/>
      <path d="M224 214v26M234 214v26M244 214v26M254 214v26M264 214v26" stroke="#5a3a24" stroke-width="2"/>
      <path d="M226 190h20v50h-20z" fill="#2a2016" stroke-width="2.5"/>
    </g>

    <!-- The shop front. -->
    <g stroke="#33281c" stroke-linejoin="round" stroke-linecap="round">
      <path d="M96 252H352V344H96z" fill="#9c937f" stroke-width="3"/>
      <!-- The fascia board, its M gone. -->
      <path d="M104 258H344V280H104z" fill="#3a5f1d" stroke-width="3"/>
      <text x="224" y="276" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="17" letter-spacing="2" fill="#ece0c0" stroke="none" xml:space="preserve">PHAR  ACY</text>
      <path d="M222 264l-4 10" stroke="#ece0c0" stroke-width="1.2" opacity="0.6"/>
      <!-- Left display window, smashed open. -->
      <path d="M108 288h70v50h-70z" fill="#2a2016" stroke-width="3"/>
      <path d="M108 288h70v10l-10 8-8-6-12 14-10-10-12 12-8-6-10 6z" fill="#8fa0a0" stroke-width="1.8"/>
      <path d="M108 338l10-8 6 8 10-6 6 6" fill="#8fa0a0" stroke-width="1.8"/>
      <!-- Toppled shelves inside. -->
      <path d="M120 336l40-26 6 6-40 24z" fill="#6a5842" stroke-width="2"/>
      <path d="M136 332h.01M148 324h.01" stroke="#ece0c0" stroke-width="4"/>
      <!-- The door, gone, dark inside. -->
      <path d="M188 288h36v56h-36z" fill="#1f1810" stroke-width="3"/>
      <path d="M188 288h36" stroke-width="3"/>
      <path d="M182 344h48v6h-48z" fill="#a39d90" stroke-width="2.5"/>
      <!-- Right window behind a rolling shutter, half drawn and rusted. -->
      <path d="M234 288h108v50H234z" fill="#2a2016" stroke-width="3"/>
      <path d="M234 288h108v34l-14 4-12-4-14 6-16-4-14 4-14-2-12 4-12-2z" fill="#a39d90" stroke-width="2.5"/>
      <path d="M234 294h108M234 300h108M234 306h108M234 312h108M234 318h108" stroke-width="1.4" opacity="0.6"/>
      <path d="M262 298c4 10 2 18-2 24M318 294c2 8 0 16-4 22" stroke="#8a5a3a" stroke-width="3" opacity="0.6"/>
      <!-- NO MEDS, sprayed across the shutter. -->
      <text x="288" y="314" text-anchor="middle" transform="rotate(-6 288 310)" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="17" fill="#b4432b" stroke="none">NO MEDS</text>
    </g>

    <!-- The green cross sign, hanging from its bracket by one chain. -->
    <g stroke="#33281c" stroke-linejoin="round" stroke-linecap="round">
      <path d="M352 196h46M352 206l20-10" fill="none" stroke-width="4"/>
      <path d="M392 196l-2 16" fill="none" stroke-width="2"/>
      <g transform="rotate(18 390 212)">
        <path d="M368 212h44v44h-44z" fill="#ece0c0" stroke-width="3"/>
        <path d="M384 218h12v12h12v12h-12v12h-12v-12h-12v-12h12z" fill="#5c8a33" stroke-width="2.5"/>
        <path d="M372 252l8-10 4 6" fill="none" stroke-width="1.6"/>
      </g>
    </g>

    </g>

    <!-- Glass, pill boxes and an overturned shopping cart on the pavement. -->
    <g stroke="#33281c" stroke-linejoin="round" stroke-linecap="round">
      <path d="M120 356l10-4 2 6zM150 362l12 2-6 4zM210 360l8-6 2 8zM260 364l10 0-4 6z" fill="#8fa0a0" stroke-width="1.6"/>
      <path d="M96 400l18-6 4 12-18 6zM140 412l16 2-2 12-16-2zM300 396l14-6 6 10-14 6zM250 420l18-2 2 12-18 2z" fill="#ece0c0" stroke-width="2"/>
      <path d="M100 404l12-4M146 418l10 2M304 398l10-4M256 426l10-2" stroke="#5c8a33" stroke-width="2"/>
      <!-- The cart, on its side. -->
      <g transform="translate(-50 -24) rotate(-14 380 440)">
        <path d="M330 410h96l-10 54h-76z" fill="none" stroke-width="3.5"/>
        <path d="M340 422h82M338 436h80M342 450h72M350 410v54M366 410v54M382 410v54M398 410v54M414 410l-4 54" stroke-width="1.6"/>
        <path d="M426 410l14-12h14" fill="none" stroke-width="3.5"/>
        <circle cx="348" cy="474" r="6" fill="#48453e" stroke-width="2.5"/>
        <circle cx="408" cy="474" r="6" fill="#48453e" stroke-width="2.5"/>
        <path d="M348 464v4M408 464v4" stroke-width="2.5"/>
      </g>
    </g>

    <!-- Weeds in the cracks. -->
    <g fill="none" stroke="#5c6a2c" stroke-width="2.6" stroke-linecap="round">
      <path d="M100 340c2-10 4-16 8-20M108 340c0-8-2-14-4-18M344 340c2-10 6-16 10-20M352 342c0-10-2-16-6-20"/>
      <path d="M90 460c2-12 6-20 12-26M98 462c0-12-2-20-6-26M106 460c4-8 8-14 14-16"/>
      <path d="M200 500c4-14 8-22 16-28M210 502c0-14-2-22-8-30"/>
    </g>
  </g>

  <!-- The medallion's frame. -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="#33281c" stroke-width="5"/>
  <circle cx="256" cy="256" r="244" fill="none" stroke="#33281c" stroke-width="9"/>
  <circle cx="256" cy="256" r="238" fill="none" stroke="#ece0c0" stroke-width="3"/>
</svg>
