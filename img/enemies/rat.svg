<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- A big rat on a heap of rubble in the ruins, teeth bared, by a broken brick wall,
       with bent rebar and a dented tin can spilling beans in the foreground. -->
  <defs>
    <clipPath id="disc"><circle cx="256" cy="256" r="232"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdb98c"/>
      <stop offset="0.45" stop-color="#e6d7b0"/>
      <stop offset="0.7" stop-color="#f3e9cc"/>
    </linearGradient>
    <linearGradient id="asphalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9d968a"/>
      <stop offset="1" stop-color="#7d766a"/>
    </linearGradient>
    <linearGradient id="concrete" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2baa6"/>
      <stop offset="1" stop-color="#aaa18c"/>
    </linearGradient>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0v7" stroke="#33281c" stroke-width="1.6" opacity="0.55"/>
    </pattern>
    <pattern id="hatch-sky" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)">
      <path d="M0 0v8" stroke="#6a5842" stroke-width="1.4" opacity="0.45"/>
    </pattern>
    <pattern id="bricks" width="16" height="8" patternUnits="userSpaceOnUse">
      <rect width="16" height="8" fill="#8f6c50"/>
      <path d="M0 0h16M0 4h16M4 0v4M12 4v4" stroke="#5e4428" stroke-width="1"/>
    </pattern>
    <!-- A loose brick, 30 by 14, from its top-left corner. -->
    <g id="brick" stroke="#33281c" stroke-width="2.5" stroke-linejoin="round">
      <path d="M0 0h30v14H0z" fill="#9a6d4c"/>
      <path d="M0 0l6-5h30l-6 5z" fill="#b5835e"/>
      <path d="M30 0l6-5v14l-6 5z" fill="#6f4a30"/>
    </g>
  </defs>

  <g clip-path="url(#disc)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <g stroke="#6a5842" stroke-width="2.5" stroke-linejoin="round">
      <path d="M300 92c8-18 30-24 44-12 10-20 40-22 52-4 16-8 36 2 38 18 12 0 20 8 18 18H300z" fill="#eadcb6"/>
      <path d="M300 102h152v10H300z" fill="url(#hatch-sky)" stroke="none"/>
    </g>
    <path d="M200 120q6-6 12 0q6-6 12 0M234 104q5-5 10 0q5-5 10 0" fill="none" stroke="#33281c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Ruined blocks in the distance. -->
    <g fill="#b9b2a2" stroke="#6a5842" stroke-width="2.5" stroke-linejoin="round">
      <path d="M150 330V214h30l10 14 10-10h30V330z"/>
      <path d="M380 330V180h40l8 16 12-12h42V330z"/>
    </g>
    <g fill="#8a8377">
      <path d="M160 230h10v12h-10zM204 236h10v12h-10zM160 262h10v12h-10zM186 262h10v12h-10zM214 290h10v12h-10zM160 296h10v12h-10z"/>
      <path d="M394 200h12v14h-12zM424 210h12v14h-12zM456 204h12v14h-12zM394 238h12v14h-12zM456 240h12v14h-12zM424 270h12v14h-12zM394 280h12v14h-12z"/>
    </g>

    <!-- A broken brick wall on the left, plaster flaking off, an empty window. -->
    <g stroke="#33281c" stroke-linejoin="round" stroke-linecap="round">
      <path d="M0 110 36 98l18 30 24-22 22 40 14-12 18 58V350H0z" fill="url(#bricks)" stroke-width="3.5"/>
      <path d="M0 150c20-6 40 0 50 14 6 20-10 40-30 40H0zM60 270c20-6 50-2 70 8v40c-30 6-60 2-74-10z" fill="#c9b78e" stroke-width="2.5"/>
      <path d="M40 210h46v70H40z" fill="#2a2016" stroke-width="3"/>
      <path d="M36 280h54v7H36z" fill="#a39d90" stroke-width="2.5"/>
      <path d="M86 214l-14 18 6 10" fill="none" stroke-width="2"/>
    </g>

    <!-- The street, half buried. -->
    <path d="M0 340H512V512H0z" fill="url(#asphalt)"/>
    <path d="M0 340H512" stroke="#33281c" stroke-width="2.5"/>
    <g fill="none" stroke="#5f594f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M40 470l30-8 16 18M420 480l26-10 20 8"/>
    </g>

    <!-- The rubble heap: a tilted slab of concrete over broken bricks. -->
    <g stroke="#33281c" stroke-linejoin="round" stroke-linecap="round">
      <path d="M34 418c20-30 60-40 100-36l260-6c40 0 70 12 90 40l-10 40H40z" fill="url(#bricks)" stroke-width="3"/>
      <path d="M50 400l30-8 8 16-30 8zM420 396l30 6-6 16-30-4zM110 420l26-4 4 14-26 4z" fill="#b5835e" stroke-width="2.5"/>
      <path d="M60 342 446 330 470 364 40 384z" fill="url(#concrete)" stroke-width="3.5"/>
      <path d="M40 384 470 364 474 392 38 414z" fill="#8c846f" stroke-width="3.5"/>
      <path d="M40 384 470 364 474 392 38 414z" fill="url(#hatch)" stroke="none"/>
      <!-- Cracks and a chipped corner. -->
      <path d="M200 340l-10 14 8 10-6 14M330 336l6 16-8 10" fill="none" stroke-width="2"/>
      <path d="M446 330l-6 14 12 4 6 8 12 8z" fill="#8c846f" stroke-width="2.5"/>
      <!-- Bent rebar sticking out of the slab. -->
      <path d="M454 342c14-20 18-40 12-60M462 354c20-10 30-26 32-44" fill="none" stroke="#7a4a2c" stroke-width="5"/>
      <path d="M70 380c-14-14-18-30-12-46" fill="none" stroke="#7a4a2c" stroke-width="5"/>
    </g>

    <!-- The rat, standing on the slab. -->
    <g transform="translate(20 -8) scale(0.95)" stroke="#33281c" stroke-linejoin="round" stroke-linecap="round">
      <ellipse cx="250" cy="374" rx="170" ry="11" fill="#33281c" opacity="0.25" stroke="none"/>
      <!-- Tail, naked and ringed. -->
      <path d="M112 356C70 356 50 380 64 402c16 22 64 18 100 6 30-10 54-4 70 10" fill="none" stroke-width="17"/>
      <path d="M112 356C70 356 50 380 64 402c16 22 64 18 100 6 30-10 54-4 70 10" fill="none" stroke="#d4938a" stroke-width="10"/>
      <path d="M84 364l4 9M68 380l9 4M64 398l9-2M78 412l5-8M100 418l1-9M126 416l-1-9M150 412l-2-9M178 404l-1-9M206 402l-1-9" fill="none" stroke="#9e5e55" stroke-width="2.2"/>
      <!-- The mouth, open, behind the jaws. -->
      <path d="M404 306 354 314 394 330z" fill="#5a1e10" stroke-width="3.6"/>
      <path d="M366 318c10 2 18 6 22 10" fill="none" stroke="#c46a62" stroke-width="4"/>
      <!-- Body and head in one outline. -->
      <path d="M100 372C84 320 110 252 200 236c50-8 90 2 114 20 20-10 44-4 62 12 14 10 26 20 34 28 4 6 0 12-8 12l-48 6 40 14c4 8-4 14-14 12-18 0-36 2-48 12-4 10-6 18-8 20z" fill="#857868" stroke-width="3.6"/>
      <!-- Darker fur along the back, lighter on the belly. -->
      <path d="M106 334c-6-40 24-82 94-92 50-6 90 2 112 20-34-8-74-6-112 6-40 12-70 34-94 66z" fill="#61574a" stroke="none"/>
      <path d="M120 370c50-14 130-18 204-8l-2 10H118z" fill="#a39684" stroke="none"/>
      <path d="M152 270q-6-10-2-18M178 258q-4-10 0-16M206 250q-2-10 4-16M238 246q0-10 6-14M270 250q2-10 8-12M296 260q4-8 10-10M128 300q-8-8-6-16" fill="none" stroke="#3f382f" stroke-width="2.5"/>
      <path d="M250 300q8 6 16 4M280 312q8 6 14 2M226 322q8 4 14 2" fill="none" stroke="#5e5446" stroke-width="2.2"/>
      <!-- Haunch, with only its front edge drawn, and the hind foot. -->
      <path d="M128 332c22-30 72-28 82 4 4 20-10 32-24 36h-50c-14-8-16-24-8-40z" fill="#6f6355" stroke="none"/>
      <path d="M132 330c22-28 70-26 80 6 4 18-8 30-22 34" fill="none" stroke-width="3.6"/>
      <path d="M150 320q10-8 22-8M146 338q8-6 16-6" fill="none" stroke="#4a4238" stroke-width="2.2"/>
      <path d="M170 368h44c8 4 4 12-6 12h-40z" fill="#d4938a" stroke-width="3"/>
      <path d="M212 371l9 2M210 377l9 3M200 380l6 4" fill="none" stroke-width="2"/>
      <!-- Front leg, the paw gripping the edge. -->
      <path d="M304 334c8 14 12 24 14 36h18c-2-12-8-24-14-34z" fill="#6f6355" stroke-width="3.6"/>
      <path d="M314 366h30c6 4 2 12-6 12h-26z" fill="#d4938a" stroke-width="3"/>
      <path d="M342 369l9 1M342 375l9 3M334 378l5 5" fill="none" stroke-width="2"/>
      <!-- Ear, thin enough to show its veins. -->
      <path d="M302 252c-12-32 8-56 32-48 18 6 18 32 2 48z" fill="#857868" stroke-width="3.6"/>
      <path d="M312 244c-6-20 4-32 20-28 10 4 10 18 2 28z" fill="#d4938a" stroke="none"/>
      <path d="M322 240c4-6 4-14 2-18M318 230l6-4" fill="none" stroke="#b06c64" stroke-width="2"/>
      <!-- An angry eye, the nose, long incisors and whiskers. -->
      <circle cx="360" cy="270" r="13" fill="#1f1810" stroke="none"/>
      <circle cx="364" cy="265" r="4.5" fill="#f6ecd6" stroke="none"/>
      <path d="M342 252l32 9" fill="none" stroke-width="5"/>
      <g fill="none" stroke-width="2">
        <path d="M398 300c24-10 48-16 72-18M400 304c24-4 50-4 76 0M398 308c22 4 46 10 68 20M390 296c16-14 36-24 58-30"/>
      </g>
      <ellipse cx="408" cy="298" rx="9" ry="8" fill="#d4938a" stroke-width="3"/>
      <path d="M386 309l2 18h9l2-19z" fill="#f0d890" stroke-width="2.6"/>
      <path d="M378 327l2-13h8l-1 13z" fill="#f0d890" stroke-width="2.6"/>
    </g>

    <!-- Loose bricks in the foreground. -->
    <use href="#brick" x="150" y="440"/>
    <use href="#brick" transform="translate(178 466) rotate(-14)"/>
    <use href="#brick" transform="translate(360 432) rotate(10)"/>

    <!-- A dented tin can on its side, spilling beans. -->
    <g stroke="#33281c" stroke-linejoin="round" stroke-linecap="round" transform="translate(266 446) rotate(-10)">
      <path d="M-46-22h84v44h-84z" fill="#a39d90" stroke-width="3"/>
      <path d="M-34-22h58v44h-58z" fill="#b4432b" stroke-width="2.5"/>
      <path d="M-34-8h58M-34 8h58" stroke="#82301c" stroke-width="2"/>
      <path d="M-46-22v44" stroke-width="3"/>
      <ellipse cx="-46" cy="0" rx="8" ry="22" fill="#8c846f" stroke-width="3"/>
      <ellipse cx="38" cy="0" rx="8" ry="22" fill="#1f1810" stroke-width="3"/>
      <path d="M38-22c14-10 28-6 30 4-10 2-22 8-30 18" fill="#c2baa6" stroke-width="2.5"/>
      <path d="M-10-22l6 8-4 8" fill="none" stroke-width="2"/>
    </g>
    <g fill="#b0602f" stroke="#33281c" stroke-width="1.6">
      <ellipse cx="316" cy="460" rx="6" ry="4"/>
      <ellipse cx="330" cy="468" rx="6" ry="4" transform="rotate(20 330 468)"/>
      <ellipse cx="322" cy="476" rx="6" ry="4"/>
      <ellipse cx="342" cy="458" rx="5" ry="3.5" transform="rotate(-20 342 458)"/>
      <ellipse cx="308" cy="474" rx="5" ry="3.5"/>
    </g>
  </g>

  <!-- The medallion's frame. -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="#33281c" stroke-width="5"/>
  <circle cx="256" cy="256" r="244" fill="none" stroke="#33281c" stroke-width="9"/>
  <circle cx="256" cy="256" r="238" fill="none" stroke="#ece0c0" stroke-width="3"/>
</svg>
