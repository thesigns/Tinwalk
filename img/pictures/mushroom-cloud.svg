<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The end of the old world, seen from the road into town: a mushroom
       cloud rising over a city whose towers are still standing. Shown when a
       new game begins. -->
  <defs>
    <clipPath id="disc"><circle cx="256" cy="256" r="232"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8946c"/>
      <stop offset="0.45" stop-color="#d6c08e"/>
      <stop offset="0.7" stop-color="#f0dfb0"/>
    </linearGradient>
    <!-- The heat behind the cloud. -->
    <radialGradient id="glow" cx="256" cy="250" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6dc96"/>
      <stop offset="0.45" stop-color="#ecc77a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ecc77a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eadbb6"/>
      <stop offset="1" stop-color="#cdb085"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8986a"/>
      <stop offset="0.6" stop-color="#d9c49c"/>
      <stop offset="1" stop-color="#c2a476"/>
    </linearGradient>
    <!-- Fire still burning under the cap. -->
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cf5b3e"/>
      <stop offset="1" stop-color="#e0921f"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9b07a"/>
      <stop offset="1" stop-color="#a88c55"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3ab98"/>
      <stop offset="1" stop-color="#8f897a"/>
    </linearGradient>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0v7" stroke="#33281c" stroke-width="1.6" opacity="0.5"/>
    </pattern>
    <pattern id="hatch-sky" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)">
      <path d="M0 0v8" stroke="#6a5842" stroke-width="1.4" opacity="0.4"/>
    </pattern>
    <!-- The billows of the cap, drawn twice: outlined, then filled over, so
         only the outer edge keeps its ink. -->
    <g id="cap-billows">
      <circle cx="256" cy="118" r="50"/>
      <circle cx="204" cy="132" r="42"/>
      <circle cx="308" cy="132" r="42"/>
      <circle cx="226" cy="100" r="36"/>
      <circle cx="288" cy="100" r="36"/>
      <circle cx="162" cy="164" r="36"/>
      <circle cx="350" cy="164" r="36"/>
      <circle cx="136" cy="196" r="24"/>
      <circle cx="376" cy="196" r="24"/>
      <circle cx="192" cy="182" r="34"/>
      <circle cx="320" cy="182" r="34"/>
      <circle cx="256" cy="176" r="44"/>
      <path d="M142 198c22 16 62 24 114 24s92-8 114-24V176H142z"/>
    </g>
    <g id="base-billows">
      <circle cx="146" cy="352" r="18"/>
      <circle cx="176" cy="340" r="26"/>
      <circle cx="212" cy="334" r="30"/>
      <circle cx="256" cy="330" r="32"/>
      <circle cx="300" cy="334" r="30"/>
      <circle cx="336" cy="340" r="26"/>
      <circle cx="366" cy="352" r="18"/>
      <path d="M128 352h256v12H128z"/>
    </g>
    <!-- The collar: a ring of cloud around the stem. Seen from below, its near
         half crosses the stem and the far half shows under it at the sides. -->
    <g id="collar-near">
      <ellipse cx="256" cy="266" rx="68" ry="8"/>
      <circle cx="328" cy="272" r="9.6"/>
      <circle cx="322.5" cy="267.4" r="10.5"/>
      <circle cx="306.9" cy="263.5" r="14.1"/>
      <circle cx="283.6" cy="260.9" r="14.1"/>
      <circle cx="256" cy="260" r="15.3"/>
      <circle cx="228.4" cy="260.9" r="13.6"/>
      <circle cx="205.1" cy="263.5" r="13.9"/>
      <circle cx="189.5" cy="267.4" r="10.8"/>
      <circle cx="184" cy="272" r="9.4"/>
    </g>
    <g id="collar-far">
      <ellipse cx="256" cy="279" rx="70" ry="8"/>
      <circle cx="328" cy="274" r="7.3"/>
      <circle cx="322.5" cy="278.6" r="7.7"/>
      <circle cx="306.9" cy="282.5" r="9.6"/>
      <circle cx="283.6" cy="285.1" r="9.6"/>
      <circle cx="256" cy="286" r="10.2"/>
      <circle cx="228.4" cy="285.1" r="9.3"/>
      <circle cx="205.1" cy="282.5" r="9.5"/>
      <circle cx="189.5" cy="278.6" r="7.9"/>
      <circle cx="184" cy="274" r="7.2"/>
    </g>
    <clipPath id="collar-near-clip">
      <circle cx="328" cy="272" r="9.6"/>
      <circle cx="322.5" cy="267.4" r="10.5"/>
      <circle cx="306.9" cy="263.5" r="14.1"/>
      <circle cx="283.6" cy="260.9" r="14.1"/>
      <circle cx="256" cy="260" r="15.3"/>
      <circle cx="228.4" cy="260.9" r="13.6"/>
      <circle cx="205.1" cy="263.5" r="13.9"/>
      <circle cx="189.5" cy="267.4" r="10.8"/>
      <circle cx="184" cy="272" r="9.4"/>
      <ellipse cx="256" cy="266" rx="68" ry="8"/>
    </clipPath>
  </defs>

  <g clip-path="url(#disc)">
    <!-- A heavy sky, lit from below by the blast. -->
    <rect width="512" height="512" fill="url(#sky)"/>
    <path d="M0 0h512v120H0z" fill="url(#hatch-sky)"/>
    <circle cx="256" cy="250" r="190" fill="url(#glow)"/>

    <!-- Crows, fleeing. -->
    <path d="M86 132q7-7 14 0q7-7 14 0M412 104q6-6 12 0q6-6 12 0M440 150q5-5 10 0q5-5 10 0M66 186q5-5 10 0q5-5 10 0" fill="none" stroke="#33281c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Fire still burning under the cap, glowing out from beneath it. -->
    <path d="M146 204c22 16 60 24 110 24s88-8 110-24c-4 14-18 24-40 30-20 6-46 8-70 8s-50-2-70-8c-22-6-36-16-40-30z" fill="url(#fire)" stroke="#33281c" stroke-width="3" stroke-linejoin="round"/>
    <path d="M170 226c22 8 52 12 86 12s64-4 86-12c-14 8-26 12-40 14-14 2-30 3-46 3s-32-1-46-3c-14-2-26-6-40-14z" fill="url(#hatch)"/>
    <!-- The stem, threaded through the collar of cloud that rings it. -->
    <!-- The far half of the collar, behind the stem. -->
    <use href="#collar-far" fill="none" stroke="#33281c" stroke-width="5"/>
    <use href="#collar-far" fill="#c4a678"/>
    <path d="M178 286c20 8 40 10 78 10s58-2 78-10" fill="none" stroke="#6a5842" stroke-width="1.6" opacity="0.6"/>
    <path d="M232 206c-2 40-4 76-12 112-4 18-12 30-22 40h116c-10-10-18-22-22-40-8-36-10-72-12-112z" fill="url(#stem)" stroke="#33281c" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M232 214c-2 38-4 70-10 104-3 14-8 24-14 32h22c4-30 6-80 6-136z" fill="url(#hatch)"/>
    <path d="M246 230c0 30-2 70-6 110M266 226c2 34 4 74 10 114" fill="none" stroke="#6a5842" stroke-width="1.6" opacity="0.6"/>
    <!-- The near half of the collar, in front of the stem. -->
    <use href="#collar-near" fill="none" stroke="#33281c" stroke-width="6"/>
    <use href="#collar-near" fill="#e6d5ad"/>
    <g clip-path="url(#collar-near-clip)">
      <ellipse cx="256" cy="278" rx="88" ry="14" fill="#c9ad7f"/>
      <ellipse cx="256" cy="278" rx="88" ry="14" fill="url(#hatch)"/>
    </g>
    <path d="M316.2 271.1c3.1 3.1 9.4 3.1 12.6 0M298.4 268.5c4.2 4.2 12.7 4.2 17 0M275.1 265.9c4.2 4.2 12.7 4.2 17 0M246.8 265.4c4.6 4.6 13.8 4.6 18.4 0M220.3 265.7c4.1 4.1 12.3 4.1 16.4 0M196.7 268.4c4.2 4.2 12.5 4.2 16.7 0M183 271.2c3.2 3.2 9.7 3.2 13 0" fill="none" stroke="#6a5842" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>
    <!-- The fire above catches the tops of the billows. -->
    <path d="M297.3 257.9A11.1 11.1 0 0 1 315.4 256.4M273.9 255.3A11.1 11.1 0 0 1 292.1 253.8M245.3 253.8A12.3 12.3 0 0 1 265.4 252.1M219.2 255.6A10.6 10.6 0 0 1 236.6 254.1M195.6 258A10.9 10.9 0 0 1 213.5 256.5" fill="none" stroke="#f6dc96" stroke-width="2.2" stroke-linecap="round"/>

    <!-- The cap. -->
    <use href="#cap-billows" fill="none" stroke="#33281c" stroke-width="7"/>
    <use href="#cap-billows" fill="url(#cap)"/>
    <!-- Inner folds of the billows. -->
    <g fill="none" stroke="#6a5842" stroke-width="2" stroke-linecap="round" opacity="0.75">
      <path d="M210 112c8-14 22-20 36-18M268 94c14-2 26 6 30 18M170 152c8-10 20-14 32-10M318 140c12-2 24 4 30 14"/>
      <path d="M150 196c10-8 22-10 34-6M330 190c10-4 22-2 32 6M228 166c12-10 30-12 44-4"/>
    </g>
    <!-- Distant hills. -->
    <path d="M0 360c40-14 80-18 120-12 30 4 50 4 80 0h112c30 4 50 4 80 0 40-6 80-2 120 12v152H0z" fill="#a9ab7c"/>

    <!-- Dust rolling out from the foot of the cloud. -->
    <use href="#base-billows" fill="none" stroke="#33281c" stroke-width="6"/>
    <use href="#base-billows" fill="#dcc9a0"/>
    <path d="M160 356c14-8 30-10 46-6M240 346c14-6 30-6 44 0M306 352c12-6 26-6 38 0" fill="none" stroke="#6a5842" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

    <!-- The city on the horizon, still standing for the moment: towers dark
         against the blast, their windows catching the flash. -->
    <g stroke="#33281c" stroke-linejoin="round">
      <path d="M51 286v-22M47 276h8M375 290v-22M371 280h8" fill="none" stroke-width="2" stroke-linecap="round"/>
      <path d="M18 364V314H44V364zM40 364V286H62V364zM60 364V310H66V300H84V310H90V364zM88 364V280L94 272L98 250L102 272L108 280V364zM106 364V318H134V364zM132 364V304H136.4V294H149.6V304H154V364zM152 364V330H170V364zM170 364V344H194V364zM192 364V336H210V364zM300 364V340H320V364zM318 364V348H344V364zM342 364V326H364V364zM362 364V290H388V364zM386 364V274L391 266L395 244L399 266L404 274V364zM402 364V316H408V306H426V316H432V364zM430 364V280H454V364zM452 364V326H458.8V316H479.2V326H486V364z" fill="#7f7a6c" stroke-width="2.4"/>
    </g>
