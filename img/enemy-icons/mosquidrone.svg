<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Map badge: a tin drone like a mosquito, hovering over the ground on two
       blurred rotors, its needle and dangling legs reaching down. -->
  <defs>
    <clipPath id="inside"><circle cx="48" cy="48" r="42"/></clipPath>
  </defs>

  <circle cx="48" cy="48" r="45" fill="#b4432b"/>
  <g clip-path="url(#inside)">
    <path d="M0 72H96V96H0z" fill="#82301c"/>
    <path d="M0 72H96" stroke="#33281c" stroke-width="2.4"/>
    <!-- Its shadow on the ground: it hovers. -->
    <ellipse cx="50" cy="80" rx="15" ry="3" fill="#33281c" opacity="0.35"/>
  </g>

  <g stroke="#33281c" stroke-linejoin="round" stroke-linecap="round">
    <!-- Legs, thin and bent, behind the body. -->
    <path d="M42 52l-5 8-3 8M48 54l-1 8-3 7M54 53l4 7 4 6" fill="none" stroke-width="2"/>
    <!-- The abdomen, tapering back like a mosquito's. -->
    <path d="M38 42c-8 1-15 5-20 11 7 1 15-1 21-6z" fill="#6b665c" stroke-width="2.4"/>
    <path d="M30 46l2 4M25 49l1.5 3" fill="none" stroke-width="1.6"/>
    <!-- Rotor masts. -->
    <path d="M39 37v-10M59 37v-10" fill="none" stroke-width="2.6"/>
    <!-- Body. -->
    <ellipse cx="49" cy="43" rx="13" ry="10" fill="#a39d90" stroke-width="2.6"/>
    <path d="M37 46c6 6 18 7 24 0-2 4-6 7-12 7s-10-3-12-7z" fill="#6b665c" stroke="none"/>
    <path d="M40 39c5-3 13-3 18 0" fill="none" stroke-width="1.6"/>
    <!-- The needle. -->
    <path d="M59 47l17 12-1 1.5-17-11z" fill="#e0bd68" stroke-width="2"/>
    <!-- A glowing lens for an eye. -->
    <circle cx="56" cy="42" r="4.6" fill="#33281c" stroke-width="1.6"/>
    <circle cx="56" cy="42" r="2.6" fill="#f3e3b0" stroke="none"/>
    <!-- Rotors, blurred with speed. -->
    <ellipse cx="39" cy="26" rx="10.5" ry="2.8" fill="#ece0c0" fill-opacity="0.7" stroke-width="2"/>
    <ellipse cx="59" cy="26" rx="10.5" ry="2.8" fill="#ece0c0" fill-opacity="0.7" stroke-width="2"/>
  </g>

  <circle cx="48" cy="48" r="45" fill="none" stroke="#33281c" stroke-width="4"/>
</svg>
