<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Map badge: two round corrugated grain silos with conical roofs and a low shed. -->
  <defs>
    <clipPath id="inside"><circle cx="48" cy="48" r="42"/></clipPath>
  </defs>

  <circle cx="48" cy="48" r="45" fill="#ece0c0"/>
  <g clip-path="url(#inside)">
    <path d="M0 75H96V96H0z" fill="#cdb67c"/>
    <path d="M0 75H96" stroke="#33281c" stroke-width="2.4"/>
  </g>

  <!-- Shed at the left. -->
  <g stroke="#33281c" stroke-width="2.8" stroke-linejoin="round">
    <path d="M13 61h15v14H13z" fill="#a39d90"/>
    <path d="M11 62 20.5 54 30 62z" fill="#6b665c"/>
  </g>
  <path d="M18 67h5v8h-5z" fill="#33281c"/>

  <!-- Short silo at the right: a shaded side shows it is round. -->
  <g stroke="#33281c" stroke-width="2.8" stroke-linejoin="round">
    <path d="M58 42h22v31q-11 4-22 0z" fill="#b9b2a2"/>
    <path d="M73 42h7v31q-3 1.5-7 2z" fill="#8f877a" stroke="none"/>
    <path d="M58 42h22v31q-11 4-22 0z" fill="none"/>
    <path d="M56 43 69 31l13 12q-13 3-26 0z" fill="#6b665c"/>
  </g>
  <path d="M58 53q11 3 22 0M58 63q11 3 22 0" fill="none" stroke="#33281c" stroke-width="1.6"/>

  <!-- Tall silo in front. -->
  <g stroke="#33281c" stroke-width="2.8" stroke-linejoin="round">
    <path d="M30 30h28v43q-14 5-28 0z" fill="#cbc2ad"/>
    <path d="M49 30h9v43q-4 2-9 2.6z" fill="#a39d90" stroke="none"/>
    <path d="M30 30h28v43q-14 5-28 0z" fill="none"/>
    <path d="M27.5 31 44 15l16.5 16q-16.5 4-33 0z" fill="#6b665c"/>
  </g>
  <path d="M30 42q14 4 28 0M30 54q14 4 28 0M30 64q14 4 28 0" fill="none" stroke="#33281c" stroke-width="1.6"/>

  <circle cx="48" cy="48" r="45" fill="none" stroke="#33281c" stroke-width="4"/>
</svg>
