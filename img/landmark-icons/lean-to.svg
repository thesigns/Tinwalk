<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Map badge: an A-frame lean-to of poles and spruce boughs, a campfire before it. -->
  <defs>
    <clipPath id="inside"><circle cx="48" cy="48" r="42"/></clipPath>
  </defs>

  <circle cx="48" cy="48" r="45" fill="#ece0c0"/>
  <g clip-path="url(#inside)">
    <path d="M0 75H96V96H0z" fill="#5c6a2c"/>
    <path d="M0 75H96" stroke="#33281c" stroke-width="2.4"/>
  </g>

  <!-- The shelter: a dark opening on the left, boughs over the right. -->
  <g stroke="#33281c" stroke-width="2.8" stroke-linejoin="round">
    <path d="M22 75 48 27 48 75z" fill="#33281c"/>
    <path d="M48 27 76 75H48z" fill="#7d8a52"/>
  </g>
  <path d="M56 50l6 3M58 60l8 4M52 39l5 2M52 66l7 3" stroke="#33281c" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Poles crossed at the top. -->
  <path d="M20 78 54 18M77 78 43 18" stroke="#a07a4c" stroke-width="5.4" stroke-linecap="round"/>
  <path d="M20 78 54 18M77 78 43 18" stroke="#33281c" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>

  <!-- Campfire. -->
  <path d="M24 75l4-9 3 5 2-8 4 12z" fill="#b4432b" stroke="#33281c" stroke-width="2" stroke-linejoin="round"/>

  <circle cx="48" cy="48" r="45" fill="none" stroke="#33281c" stroke-width="4"/>
</svg>
