<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Map badge: a town pharmacy with its shopfront and a green cross sign. -->
  <defs>
    <clipPath id="inside"><circle cx="48" cy="48" r="42"/></clipPath>
  </defs>

  <circle cx="48" cy="48" r="45" fill="#ece0c0"/>
  <g clip-path="url(#inside)">
    <path d="M0 73H96V96H0z" fill="#a39d90"/>
    <path d="M0 73H96" stroke="#33281c" stroke-width="2.4"/>
  </g>

  <!-- The building: the shaded side, the front, the cornice. -->
  <g stroke="#33281c" stroke-width="2.8" stroke-linejoin="round">
    <path d="M62 30l8 3v38l-8 2z" fill="#8f877a"/>
    <path d="M18 30h44v43H18z" fill="#cbc2ad"/>
    <path d="M15 25h50v6H15z" fill="#a39d90"/>
  </g>
  <!-- Upper windows, the sign band, the shop window and door. -->
  <g fill="#33281c">
    <path d="M24 36h7v9h-7zM36.5 36h7v9h-7zM49 36h7v9h-7z"/>
    <path d="M18 50h44v5H18z"/>
    <path d="M23 59h18v10H23z"/>
    <path d="M46 59h10v14H46z"/>
  </g>

  <!-- The cross sign, big enough to tell the pharmacy from other town buildings. -->
  <path d="M55 27h24v24H55z" fill="#5c8a33" stroke="#33281c" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M64 31h6v6h6v6h-6v6h-6v-6h-6v-6h6z" fill="#f6ecd6" stroke="#33281c" stroke-width="1.6" stroke-linejoin="round"/>

  <circle cx="48" cy="48" r="45" fill="none" stroke="#33281c" stroke-width="4"/>
</svg>
