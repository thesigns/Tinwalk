<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Map badge: a lattice radio mast held by guy wires, a dead red lamp on top, a hut at its foot. -->
  <defs>
    <clipPath id="inside"><circle cx="48" cy="48" r="42"/></clipPath>
  </defs>

  <circle cx="48" cy="48" r="45" fill="#ece0c0"/>
  <g clip-path="url(#inside)">
    <path d="M0 75H96V96H0z" fill="#cdb67c"/>
    <path d="M0 75H96" stroke="#33281c" stroke-width="2.4"/>
  </g>
  <g clip-path="url(#inside)">
    <!-- Guy wires. -->
    <path d="M48 30 12 75M48 30l36 45M48 50 24 75M48 50l24 25" stroke="#33281c" stroke-width="1.4" fill="none"/>
  </g>

  <!-- The mast: two legs and zigzag bracing. -->
  <g stroke="#33281c" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M42 75 47 18M54 75 49 18" stroke-width="2.8"/>
    <path d="M42.4 74 53 67.1 43.6 60.2 51.7 53.4 44.9 46.5 50.5 39.6 46.1 32.8 49.2 25.9 47.4 19" stroke-width="1.8"/>
  </g>

  <!-- The transmitter hut. -->
  <g stroke="#33281c" stroke-width="2.6" stroke-linejoin="round">
    <path d="M60 64h16v11H60z" fill="#a39d90"/>
    <path d="M58 65 68 59 78 65z" fill="#6b665c"/>
  </g>
  <path d="M64 68h4v7h-4z" fill="#33281c"/>

  <!-- The dead lamp on top. -->
  <path d="M48 18v-4" stroke="#33281c" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="48" cy="12" r="3.6" fill="#b4432b" stroke="#33281c" stroke-width="2"/>
  <circle cx="48" cy="48" r="45" fill="none" stroke="#33281c" stroke-width="4"/>
</svg>
