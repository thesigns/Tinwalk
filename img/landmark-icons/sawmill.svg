  <circle cx="58" cy="60" r="4" fill="#6b665c" stroke="#33281c" stroke-width="2"/>
  <path d="M46 50l6 2M64 44l2 6" stroke="#82301c" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

