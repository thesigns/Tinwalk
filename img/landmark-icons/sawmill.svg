    <path d="M34 60h48v6H34z" fill="#8b6a42"/>
    <path d="M38 66v9M78 66v9" fill="none"/>
  </g>
  <circle cx="48" cy="48" r="45" fill="none" stroke="#33281c" stroke-width="4"/>
</svg>
