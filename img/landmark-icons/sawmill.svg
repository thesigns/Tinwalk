<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Map badge: a big circular saw standing out of its table, logs stacked beside it. -->
  <defs>
    <clipPath id="inside"><circle cx="48" cy="48" r="42"/></clipPath>
  </defs>

  <circle cx="48" cy="48" r="45" fill="#ece0c0"/>
  <g clip-path="url(#inside)">
    <path d="M0 75H96V96H0z" fill="#5c6a2c"/>
    <path d="M0 75H96" stroke="#33281c" stroke-width="2.4"/>
  </g>
  <!-- Stacked logs, their cut ends showing. -->
  <g stroke="#33281c" stroke-width="2.4" fill="#c9a36a">
    <circle cx="16" cy="69" r="6"/><circle cx="28" cy="69" r="6"/><circle cx="22" cy="59" r="6"/>
  </g>
  <path d="M16 69h.01M28 69h.01M22 59h.01" stroke="#33281c" stroke-width="2.6" stroke-linecap="round"/>

