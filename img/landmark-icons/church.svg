<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Map badge: a brick church, the tower and spire at the front, the nave behind. -->
  <defs>
    <clipPath id="inside"><circle cx="48" cy="48" r="42"/></clipPath>
  </defs>

  <circle cx="48" cy="48" r="45" fill="#ece0c0"/>
  <g clip-path="url(#inside)">
    <path d="M0 73H96V96H0z" fill="#a39d90"/>
    <path d="M0 73H96" stroke="#33281c" stroke-width="2.4"/>
  </g>

  <g stroke="#33281c" stroke-width="2.8" stroke-linejoin="round">
    <!-- Nave and its roof. -->
    <path d="M40 46h38v27H40z" fill="#9a6448"/>
    <path d="M38 47 50 35h24l7 12z" fill="#6b665c"/>
    <!-- Tower and spire. -->
    <path d="M24 36h18v37H24z" fill="#9a6448"/>
    <path d="M22 37 33 19 44 37z" fill="#6b665c"/>
  </g>
  <!-- Cross on the spire. -->
  <path d="M33 19V11M29.5 14h7" stroke="#33281c" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Pointed windows and the door. -->
  <g fill="#33281c">
    <path d="M30 50v-5l3-4 3 4v5zM29 73v-9l4-5 4 5v9z"/>
    <path d="M48 66v-8l3-4 3 4v8zM62 66v-8l3-4 3 4v8z"/>
  </g>

  <circle cx="48" cy="48" r="45" fill="none" stroke="#33281c" stroke-width="4"/>
</svg>
