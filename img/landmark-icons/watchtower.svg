    <path d="M32 31h32v4H32z" fill="#6b665c"/>
    <path d="M35 19h26v12H35z" fill="#a39d90"/>
    <path d="M38 22h20v6H38z" fill="#33281c" stroke-width="0"/>
    <path d="M31 20 48 11 65 20z" fill="#6b665c"/>
  </g>
  <path d="M44.5 22v6M51.5 22v6" stroke="#a39d90" stroke-width="1.8"/>

  <circle cx="48" cy="48" r="45" fill="none" stroke="#33281c" stroke-width="4"/>
</svg>
