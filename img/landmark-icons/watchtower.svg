<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Map badge: a steel fire lookout tower above the spruces, its cabin on top. -->
  <defs>
    <clipPath id="inside"><circle cx="48" cy="48" r="42"/></clipPath>
  </defs>

  <circle cx="48" cy="48" r="45" fill="#ece0c0"/>
  <g clip-path="url(#inside)">
    <!-- Spruces behind the tower. -->
    <g fill="#6f7f45" stroke="#33281c" stroke-width="2.4" stroke-linejoin="round">
      <path d="M8 75 20 40 32 75z"/>
      <path d="M64 75 76 44 88 75z"/>
    </g>
    <path d="M0 75H96V96H0z" fill="#5c6a2c"/>
    <path d="M0 75H96" stroke="#33281c" stroke-width="2.4"/>
  </g>

  <!-- Legs and cross bracing. -->
  <g stroke="#33281c" stroke-linecap="round" fill="none">
    <path d="M38 34 31 75M58 34l7 41" stroke-width="3.2"/>
    <path d="M37 41h22M35.5 54h25M33.5 66h29M37 41l23.5 13M59 41 35.5 54M35.5 54l27 12M60.5 54l-27 12" stroke-width="2"/>
  </g>

  <!-- The cabin, its window band and roof. -->
