<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Map badge: a wooden post mill on a strip of field. -->
  <defs>
    <clipPath id="inside"><circle cx="48" cy="48" r="42"/></clipPath>
    <g id="sail" stroke="#33281c" stroke-width="2.6" stroke-linejoin="round">
      <path d="M1.5 -10h7.5v-19h-7.5z" fill="#f6ecd6"/>
      <path d="M0 -6V-30" stroke-linecap="round" stroke-width="3.4"/>
    </g>
  </defs>

  <circle cx="48" cy="48" r="45" fill="#ece0c0"/>
  <g clip-path="url(#inside)">
    <path d="M0 75H96V96H0z" fill="#cdb67c"/>
    <path d="M0 75H96" stroke="#33281c" stroke-width="2.4"/>
  </g>

  <!-- Trestle. -->
  <path d="M48 62V75M48 66 40 75M48 66l8 9" stroke="#33281c" stroke-width="3.2" stroke-linecap="round" fill="none"/>

  <!-- Body and roof. -->
  <g stroke="#33281c" stroke-width="2.8" stroke-linejoin="round">
    <path d="M35 39h26v24H35z" fill="#a8814f"/>
    <path d="M32 40 48 26 64 40z" fill="#6b4f30"/>
    <path d="M50 53h7v10h-7z" fill="#33281c" stroke-width="0"/>
  </g>

  <!-- Sails. -->
  <g transform="translate(43 44)">
    <use href="#sail" transform="rotate(-35)"/>
    <use href="#sail" transform="rotate(55)"/>
    <use href="#sail" transform="rotate(145)"/>
    <use href="#sail" transform="rotate(235)"/>
    <circle r="3.6" fill="#6b4f30" stroke="#33281c" stroke-width="2.2"/>
  </g>

  <circle cx="48" cy="48" r="45" fill="none" stroke="#33281c" stroke-width="4"/>
</svg>
